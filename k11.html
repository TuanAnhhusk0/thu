<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toán 11 · Kết nối tri thức · Trình chiếu dạy học</title>
<meta name="description" content="Trình chiếu dạy học Toán 11 (Kết nối tri thức với cuộc sống), hình học không gian: Chương IV Quan hệ song song, Chương VII Quan hệ vuông góc. Hình không gian xoay được, tiến trình 5E, lời giải hiện từng bước, ghi chú giáo viên.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;1,400;1,600&display=swap">
<style>
/* Bố cục: "bảng xanh" ở đầu (chương · các bài · công cụ) · sân khấu hai cột (nội dung bài | hình không gian) · thanh điều khiển ở cuối */
:root{
  --bg:#f2f6fc; --surface:#ffffff; --surface-2:#eef3fa; --ink:#0f1d2e; --ink-2:#33465c; --muted:#5a6b80;
  --line:#d8e2ee; --line-2:#bccadb;
  --board:#1554ad; --board-2:#2b6fcf; --board-3:#0d3c80; --board-ink:#ffffff; --board-mute:#cfe0fa; --board-line:rgba(255,255,255,.38);
  --chalk:#ffffff; --chalk-ink:#0f4594;
  --accent:#1b5fc4; --accent-ink:#ffffff; --accent-soft:#e4eefc; --accent-2:#0f4594;
  --key:#fff1a6; --key-ink:#3b2e00;
  --box:#f0f6ff; --box-line:#3b7ddb; --box-ink:#124a9c;
  --note:#f5f8fc; --note-line:#9fb6d3; --note-ink:#2b4a70;
  --pp:#fff8e8; --pp-line:#efc56b; --pp-ink:#8a5300;
  --ok:#137a3b; --ok-soft:#e1f4e7; --no:#c0392b; --no-soft:#fde6e3;
  --figbg:#ffffff; --fk:#15202c; --f1:#1f63d6; --f2:#e2620f; --f3:#13894a; --f4:#d22f3b; --f5:#7446d6; --f6:#6b7889; --fl:#cbd5e1;
  /* khung hình kiểu GeoGebra */
  --gg:#6557d2; --gg-ink:#ffffff; --gg-soft:#efedfb; --gg-line:#cdc7f2; --gg-track:#dcdfe5;
  --gg-major:#cfd5dd; --gg-minor:#edf0f3; --gg-axis:#202428; --ggpt:#1565c0; --ggring:rgba(0,0,0,.6);
  --ggbar:#ffffff; --ggbar-line:#e3e6ea; --ggicon:#5f6368; --ggbtn:#ffffff; --gghover:#f1f3f4;
  --ggfont:Arial,"Helvetica Neue",Helvetica,"Liberation Sans",sans-serif;
  --shadow:0 1px 2px rgba(16,45,90,.06),0 4px 16px rgba(16,45,90,.07);
  --font:"Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --math:"Noto Serif","Times New Roman",Times,"Cambria",serif;
  --fs:1;
}
:root[data-theme="dark"]{
  --bg:#0a1220; --surface:#101b2d; --surface-2:#16243a; --ink:#e6eef8; --ink-2:#b5c4d8; --muted:#8a9bb2;
  --line:#22324a; --line-2:#33476a;
  --board:#0f2f5c; --board-2:#184177; --board-3:#0a2246; --board-ink:#eaf2ff; --board-mute:#9fbbe3; --board-line:rgba(255,255,255,.24);
  --chalk:#dbe8ff; --chalk-ink:#0d2c57;
  --accent:#6aa6ff; --accent-ink:#071528; --accent-soft:#16305a; --accent-2:#9cc4ff;
  --key:#3d3415; --key-ink:#f8e7a2;
  --box:#122544; --box-line:#4f8fe6; --box-ink:#a9c9ff;
  --note:#141f31; --note-line:#3e5a82; --note-ink:#b3c8e6;
  --pp:#2a2212; --pp-line:#86692a; --pp-ink:#f0cf86;
  --ok:#4cc27a; --ok-soft:#12301f; --no:#f08072; --no-soft:#3b1d19;
  --figbg:#0e1828; --fk:#e4ecf6; --f1:#6aa3ff; --f2:#ff9a52; --f3:#4fd08a; --f4:#ff6b74; --f5:#b393ff; --f6:#93a3b8; --fl:#2f4058;
  --gg:#a397ff; --gg-ink:#120c36; --gg-soft:#25214a; --gg-line:#4a4390; --gg-track:#2c3b52;
  --gg-major:#2b3a50; --gg-minor:#172238; --gg-axis:#d9e2ee; --ggpt:#6aa6ff; --ggring:#0e1828;
  --ggbar:#101b2d; --ggbar-line:#22324a; --ggicon:#a9b8cc; --ggbtn:#16243a; --gghover:#1d2e48;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(112.5% * var(--fs));-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{min-height:100%;display:flex;flex-direction:column}

/* ---- Bảng xanh ---- */
.board{background:linear-gradient(100deg,var(--board-3) 0%,var(--board) 52%,var(--board-2) 100%);color:var(--board-ink);display:flex;flex-wrap:wrap;align-items:center;gap:.45rem .9rem;padding:.45rem clamp(12px,1.6vw,22px);box-shadow:0 2px 10px rgba(10,40,90,.2);position:relative;z-index:8}
.brand{min-width:0;flex:0 1 auto}
.eyebrow{margin:0;font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--board-mute);font-weight:600}
.brand h1{margin:0;font-size:.98rem;line-height:1.25;font-weight:700;text-wrap:balance}
.lessons{display:flex;gap:.3rem;flex:1 1 auto;overflow-x:auto;scrollbar-width:thin;min-width:0;padding-bottom:2px}
.lessons button,.tbtn{background:transparent;border:1px solid var(--board-line);color:var(--board-ink);border-radius:999px;padding:.22rem .7rem;font-size:.76rem;cursor:pointer;white-space:nowrap}
.lessons button:hover,.tbtn:hover{background:var(--board-2)}
.lessons button[aria-current="true"]{background:var(--chalk);border-color:var(--chalk);color:var(--chalk-ink);font-weight:600}
.tools{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap}
.tbtn[aria-pressed="true"]{background:var(--board-2);border-color:var(--chalk)}
.tbtn svg{display:block;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn.ic{padding:.3rem .5rem}

/* ---- Sân khấu ---- */
.stage{position:relative;display:grid;grid-template-columns:minmax(0,var(--lw,48fr)) 18px minmax(0,var(--rw,52fr));gap:.8rem .3rem;padding:.7rem clamp(10px,1.4vw,20px);align-items:start}
body.wide .stage{grid-template-columns:minmax(0,1fr)}
body.figmax .stage{grid-template-columns:minmax(0,1fr)}
body.figmax .lesson{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;box-shadow:var(--shadow)}
.lesson{display:flex;flex-direction:column;overflow:hidden}
.lscroll{padding:1rem 1.35rem 1.3rem}
.lz{zoom:var(--tz,1)}
body.wide .lesson{max-width:1240px;width:100%;justify-self:center}
@media (min-width:980px) and (min-height:560px){
  .app{height:100%;height:100dvh}
  .stage{flex:1;min-height:0;align-items:stretch;grid-template-rows:minmax(0,1fr)}
  .lesson{min-height:0}
  .lscroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
  .figp{display:flex;flex-direction:column;min-height:0}
  .fwrap svg.fig{min-height:180px}
  .ffoot{max-height:46%}
}

/* ---- Đầu màn ---- */
.e5{display:flex;gap:.25rem;flex-wrap:wrap;margin:0 0 .4rem;padding:0;list-style:none}
.e5 li{font-size:.66rem;padding:.05rem .5rem;border-radius:999px;color:var(--muted);border:1px solid var(--line)}
.e5 li.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.kicker{font-size:.72rem;color:var(--muted);margin:0;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.05rem .45rem;border-radius:5px;background:var(--surface-2);color:var(--ink-2)}
.tag.hd{background:#e6eefc;color:#1d4a9c}.tag.vd{background:#e3f4ea;color:#11643a}.tag.lt{background:#f3e8fb;color:#6a2c9c}
.tag.vdg{background:#fdecdc;color:#94420b}.tag.bt{background:#fbe6e6;color:#9b2525}.tag.kn{background:#fff1cc;color:#7a5200}
:root[data-theme="dark"] .tag.hd{background:#1b2d4c;color:#a9c4f5}:root[data-theme="dark"] .tag.vd{background:#15301f;color:#8fdcab}
:root[data-theme="dark"] .tag.lt{background:#2c1d3c;color:#d2b0f2}:root[data-theme="dark"] .tag.vdg{background:#3a2412;color:#f6bd8c}
:root[data-theme="dark"] .tag.bt{background:#3b1a1a;color:#f3a7a7}:root[data-theme="dark"] .tag.kn{background:#3a2f12;color:#f1d88c}
.lesson h2{font-size:1.3rem;line-height:1.28;margin:.15rem 0 .65rem;text-wrap:balance}
.lesson h2:focus{outline:none}
.lesson h3{font-size:.95rem;margin:.9rem 0 .35rem}
.lesson p{margin:.45rem 0}
.cont>*:first-child{margin-top:0}

/* ---- Khối nội dung ---- */
.lbl{font-weight:700;color:var(--accent)}
.box{background:var(--box);border:1.5px solid var(--box-line);border-radius:10px;padding:.55rem .95rem;margin:.65rem 0}
.box .bt{color:var(--box-ink);font-weight:700;display:block;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:.1rem}
.box p{margin:.3rem 0}
.box ul{margin:.2rem 0;padding-left:1.15rem}
.note{background:var(--note);border-left:4px solid var(--note-line);border-radius:8px;padding:.45rem .9rem;margin:.6rem 0}
.note .bt{color:var(--note-ink);font-weight:700;font-size:.8rem}
.ask{background:var(--accent-soft);border-radius:10px;padding:.5rem .9rem;margin:.6rem 0}
.qa{border:1px dashed var(--line-2);border-radius:10px;padding:.45rem .85rem;margin:.55rem 0}
.qa .qq{display:flex;gap:.5rem;align-items:baseline}
.qa .qi{flex:0 0 auto;width:1.35em;height:1.35em;border-radius:50%;background:var(--no);color:#fff;font-weight:700;display:inline-grid;place-items:center;font-size:.8rem}
.qa .qb{margin-top:.25rem}
.qa .qans{margin:.35rem 0 .1rem;padding:.35rem .7rem;background:var(--ok-soft);border-radius:8px}
.lnk{background:none;border:0;padding:.15rem 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.8rem}
.lnk:hover{color:var(--accent)}
ul.li,ol.abc{margin:.35rem 0;padding-left:0;list-style:none}
ul.li li{position:relative;padding-left:1.1rem;margin:.18rem 0}
ul.li li::before{content:"";position:absolute;left:.25rem;top:.72em;width:.38rem;height:.38rem;border-radius:50%;background:var(--accent)}
ol.abc li{display:flex;gap:.45rem;margin:.18rem 0}
ol.abc li>b:first-child{min-width:1.35em;color:var(--accent)}
.key{background:var(--key);color:var(--key-ink);border-radius:4px;padding:0 .22em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.src{font-size:.78rem;color:var(--muted)}
.tw{overflow-x:auto;margin:.5rem 0;max-width:100%}
table.tb{border-collapse:collapse;font-size:.9rem;min-width:100%}
.tb th,.tb td{border:1px solid var(--line-2);padding:.35rem .6rem;text-align:left;vertical-align:top}
.tb thead th{background:var(--surface-2)}

/* ---- Phương pháp giải · lời giải từng bước có lý do ---- */
.pp{background:var(--pp);border:1.5px solid var(--pp-line);border-radius:10px;padding:.15rem .95rem .4rem;margin:.65rem 0}
.pp>summary{cursor:pointer;list-style:none;color:var(--pp-ink);font-weight:700;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;padding:.35rem 0 .15rem;display:flex;align-items:center;gap:.4rem}
.pp>summary::-webkit-details-marker{display:none}
.pp>summary::before{content:"▸";display:inline-block;transition:transform .15s}
.pp[open]>summary::before{transform:rotate(90deg)}
.pp>summary::after{content:"bấm để ẩn";margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;font-size:.72rem;color:var(--muted)}
.pp:not([open])>summary::after{content:"bấm để xem"}
.pp ol{margin:.1rem 0 .1rem;padding-left:1.35rem}
.pp li{margin:.2rem 0;padding-left:.15rem}
.pp li::marker{color:var(--pp-ink);font-weight:700}
ol.ds{list-style:none;margin:.4rem 0;padding:0;counter-reset:ds}
ol.ds>li{counter-increment:ds;position:relative;padding:.3rem 0 .35rem 2.05rem;border-bottom:1px dashed var(--line)}
ol.ds>li:last-child{border-bottom:0}
ol.ds>li::before{content:counter(ds);position:absolute;left:0;top:.42rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.78rem;display:grid;place-items:center}
ol.ds .why{display:block;font-size:.82rem;color:var(--pp-ink);font-style:italic;line-height:1.45}
ol.ds .wk{display:block;margin-top:.1rem}

/* ---- Bước giải ---- */
.stp{margin:.5rem 0}
.stp>.ph{display:flex;width:100%;text-align:left;gap:.5rem;align-items:center;background:transparent;border:1.5px dashed var(--line-2);border-radius:10px;padding:.42rem .8rem;color:var(--muted);font-size:.85rem;cursor:pointer}
.stp>.ph:hover{border-color:var(--accent);color:var(--accent)}
.stp>.ph .n{font-weight:700}
.stp>.bd{display:none;border-left:3px solid var(--accent);padding:.05rem 0 .05rem .85rem}
.stp.on>.ph{display:none}
.stp.on>.bd{display:block;animation:fin .25s ease}
.stp .sl{display:block;font-size:.66rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-top:.1rem}
@keyframes fin{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- Kí hiệu toán ---- */
.m{font-family:var(--math);white-space:nowrap}
.m i{font-style:italic}
.m sub,.m sup{font-size:.7em;line-height:0}
.ss{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.7em;line-height:1.08;margin:0 .04em;text-align:left}
.ss>span{display:block}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.15;font-size:.95em}
.fr>span{display:block;padding:0 .18em}
.fr>span:first-child{border-bottom:1.3px solid currentColor}
.sq{display:inline-flex;align-items:stretch}
.sq>span{border-top:1.3px solid currentColor;padding:0 .1em;margin-top:.12em}
.hat{position:relative;display:inline-block}
.hat::before{content:"";position:absolute;left:8%;right:8%;top:-.12em;height:.32em;border-top:1.3px solid currentColor;border-radius:50% 50% 0 0}
.vec{position:relative;display:inline-block;padding-top:.34em;line-height:1}
.vec::before{content:"";position:absolute;left:.12em;right:.06em;top:.22em;border-top:.075em solid currentColor}
.vec::after{content:"";position:absolute;right:.1em;top:.12em;width:.17em;height:.17em;border-top:.075em solid currentColor;border-right:.075em solid currentColor;transform:rotate(45deg)}
.vec.v1{padding-right:.12em}
.vec.v1::before{left:.16em;right:.02em}
.vec.v1::after{right:.06em}
.wrapm .m{white-space:normal}

/* ---- Trắc nghiệm ---- */
.mc{border:1px solid var(--line);border-radius:12px;padding:.6rem .9rem;margin:.6rem 0}
.mc .mq{margin:0 0 .3rem}
.mc .ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:.3rem .5rem}
.op{display:flex;gap:.5rem;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line-2);border-radius:10px;padding:.35rem .7rem;cursor:pointer;align-items:baseline}
.op:hover{border-color:var(--accent)}
.op>b{color:var(--accent);min-width:1.2em}
.op.ok{border-color:var(--ok);background:var(--ok-soft)}
.op.no{border-color:var(--no);background:var(--no-soft)}
.op[aria-disabled="true"]{cursor:default}
.mx{margin-top:.35rem;font-size:.92rem}
.okt{color:var(--ok)}.not{color:var(--no)}

/* ---- Tổng quan bài/chương ---- */
.ovg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:.8rem;margin:.6rem 0}
.ovc{border:1px solid var(--line);border-radius:12px;padding:.6rem .95rem}
.ovc h3{margin:0 0 .3rem;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.ovc ul{margin:.1rem 0;padding-left:1.1rem}
.plan{columns:2 300px;column-gap:1.2rem;margin:.4rem 0}
.plan .ph5{break-inside:avoid;margin:0 0 .7rem}
.plan .ph5 h4{margin:0 0 .2rem;font-size:.76rem;color:var(--accent);letter-spacing:.05em;text-transform:uppercase}
.plan button{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.3rem .2rem;cursor:pointer;font-size:.88rem}
.plan button:hover{background:var(--surface-2)}
.plan .tg{font-size:.72rem;color:var(--muted);white-space:nowrap}
.lcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:.8rem;margin:.6rem 0}
.lcard{display:flex;flex-direction:column;gap:.3rem;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem;cursor:pointer}
.lcard:hover{border-color:var(--accent)}
.lcard .no{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.lcard .ti{font-weight:700;font-size:1rem;line-height:1.3}
.lcard .ds{font-size:.82rem;color:var(--ink-2)}
.kbd{display:inline-block;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 .35em;font-size:.8em;background:var(--surface-2)}

/* ---- Ghi chú GV ---- */
.gv{margin-top:1.1rem;border:1.5px dashed var(--line-2);border-radius:12px;padding:0 1rem;background:var(--surface-2);font-size:.86rem}
.gv>summary{cursor:pointer;font-weight:700;color:var(--ink-2);padding:.45rem 0}
.gv ul{margin:.1rem 0 .7rem;padding-left:1.1rem}
.gv li{margin:.15rem 0}

/* ---- Hình: khung kiểu GeoGebra — thanh tiêu đề, vùng vẽ phủ kín, nút thu phóng tròn góc dưới phải, thanh trượt ---- */
.figp{padding:0;overflow:hidden;background:var(--figbg)}
.fhead{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;margin:0;padding:.3rem .45rem .3rem .95rem;min-height:46px;background:var(--ggbar);border-bottom:1px solid var(--ggbar-line);flex:0 0 auto}
.fhead .cap{font-weight:700;font-size:.85rem;flex:1 1 12rem;min-width:0;line-height:1.3}
.ftools{display:flex;align-items:center;gap:.15rem;margin-left:auto}
.fbtn{display:inline-flex;align-items:center;gap:.35rem;height:34px;border:1px solid transparent;background:transparent;color:var(--ggicon);border-radius:8px;padding:0 .6rem;font-size:.76rem;font-weight:600;cursor:pointer;white-space:nowrap}
.fbtn svg{display:block;width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fbtn:hover{background:var(--gghover);color:var(--ink)}
.fbtn[aria-pressed="true"]{background:var(--gg-soft);border-color:var(--gg-line);color:var(--gg)}
.fwrap{position:relative;flex:1;min-height:0;display:flex;background:var(--figbg);overflow:hidden;isolation:isolate}
svg.fig{display:block;width:100%;height:100%;min-height:260px;background:var(--figbg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
svg.fig:active{cursor:grabbing}
@media (max-width:979px),(max-height:559px){svg.fig{height:auto;aspect-ratio:4/3;max-height:70vh}}
.fzoom{position:absolute;right:12px;bottom:12px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .25s ease}
/* cụm nút chỉ hiện khi đang dùng chuột trên hình, để hình chiếu cho học sinh không bị che; máy cảm ứng thì luôn hiện */
.fwrap.act .fzoom,.fzoom:focus-within{opacity:1;pointer-events:auto}
@media (hover:none){.fzoom{opacity:1;pointer-events:auto}}
.zb{width:40px;height:40px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:var(--ggbtn);color:var(--ggicon);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.24),0 3px 10px rgba(0,0,0,.1);transition:background .12s,color .12s}
.zb svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

<script>
'use strict';
/* ================= Hình học vectơ (dùng trong dữ liệu bài) ================= */
const V = (x, y, z) => [x, y, z];
const add = (u, v) => [u[0] + v[0], u[1] + v[1], u[2] + v[2]];
const sub = (u, v) => [u[0] - v[0], u[1] - v[1], u[2] - v[2]];
const mul = (u, k) => [u[0] * k, u[1] * k, u[2] * k];
const dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
const cross = (u, v) => [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
const len = u => Math.hypot(u[0], u[1], u[2]);
const unit = u => { const l = len(u) || 1; return [u[0] / l, u[1] / l, u[2] / l]; };
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mid = (a, b) => lerp(a, b, .5);
const cen = (...ps) => mul(ps.reduce((s, p) => add(s, p), [0, 0, 0]), 1 / ps.length);
const footL = (p, a, b) => { const d = sub(b, a); return add(a, mul(d, dot(sub(p, a), d) / dot(d, d))); };
const nrm = (a, b, c) => unit(cross(sub(b, a), sub(c, a)));
const footP = (p, a, b, c) => { const n = nrm(a, b, c); return sub(p, mul(n, dot(sub(p, a), n))); };
/* giao điểm hai đường thẳng (đồng phẳng) AB và CD */
function xLL(a, b, c, d) {
  const u = sub(b, a), v = sub(d, c), w = sub(a, c);
  const A = dot(u, u), B = dot(u, v), C = dot(v, v), D = dot(u, w), E = dot(v, w), den = A * C - B * B;
  if (Math.abs(den) < 1e-12) return mid(a, c);
  const s = (B * E - C * D) / den, t = (A * E - B * D) / den;
  return mid(add(a, mul(u, s)), add(c, mul(v, t)));
}
/* giao điểm đường thẳng PQ với mặt phẳng ABC */
function xLP(p, q, a, b, c) { const n = cross(sub(b, a), sub(c, a)), d = sub(q, p), den = dot(d, n); return Math.abs(den) < 1e-12 ? p : add(p, mul(d, dot(sub(a, p), n) / den)); }
/* hình bình hành mặt phẳng: tâm o, hai nửa cạnh u, v */
const quad = (o, u, v) => [add(add(o, mul(u, -1)), mul(v, -1)), add(add(o, u), mul(v, -1)), add(add(o, u), v), add(add(o, mul(u, -1)), v)];
const deg = x => x * Math.PI / 180;
/* thiết diện của đa diện lồi (danh sách cạnh) với mặt phẳng qua p0, pháp tuyến n0: trả về đa giác theo thứ tự */
function section(edges, p0, n0) {
  const out = [];
  edges.forEach(([a, b]) => { const da = dot(sub(a, p0), n0), db = dot(sub(b, p0), n0); if ((da <= 1e-12 && db >= -1e-12) || (da >= -1e-12 && db <= 1e-12)) { if (Math.abs(da - db) < 1e-12) return; const p = lerp(a, b, da / (da - db)); if (!out.some(q => len(sub(q, p)) < 1e-7)) out.push(p); } });
  if (out.length < 3) return out;
  const c = cen(...out), n = unit(n0), u = unit(sub(out[0], c)), v = cross(n, u);
  return out.sort((p, q) => Math.atan2(dot(sub(p, c), v), dot(sub(p, c), u)) - Math.atan2(dot(sub(q, c), v), dot(sub(q, c), u)));
}
/* các cạnh của khối từ danh sách mặt */
function edgesOf(pts, faces) { const m = new Map(); faces.trim().split(/\s+/).forEach(f => { const ns = f.match(/_[A-Za-z0-9]+|[A-Z][0-9]*'{0,2}/g); ns.forEach((a, i) => { const b = ns[(i + 1) % ns.length], k = [a, b].sort().join('|'); if (!m.has(k)) m.set(k, [pts[a], pts[b]]); }); }); return [...m.values()]; }
/* gán tên cho dãy điểm: names('_c', [p0, p1, ...]) → {_c0: p0, ...} */
const names = (k, arr) => { const r = {}; arr.forEach((p, i) => { r[k + i] = p; }); return r; };
const chain = (k, n) => Array.from({length: n}, (_, i) => k + i).join('');
/* tiện ích dựng hình dùng chung */
const PQ = (k, o, u, v) => { const q = quad(o, u, v), r = {}; q.forEach((p, i) => { r[k + (i + 1)] = p; }); return r; };
const PLANE = (k, n, c, extra) => Object.assign({p: `${k}1${k}2${k}3${k}4`, c: c == null ? 1 : c, o: .1, occ: 1, pn: n ? {n} : null}, extra || {});
const ring = (k, n) => Array.from({length: n}, (_, i) => `${k}${i}${k}${(i + 1) % n}`).join(' ');
const circ = (k, c, u, v, n) => { const r = {}; for (let i = 0; i < n; i++) { const t = 2 * Math.PI * i / n; r[k + i] = add(c, add(mul(u, Math.cos(t)), mul(v, Math.sin(t)))); } return r; };
const projOn = (M, p0, n, d) => sub(M, mul(d, dot(sub(M, p0), n) / dot(d, n)));
const angDeg = (u, v) => Math.acos(Math.min(1, Math.abs(dot(u, v)) / (len(u) * len(v) || 1))) * 180 / Math.PI;
const fmtDeg = x => (Math.round(x * 10) / 10).toString().replace('.', ',') + '°';
const fmtN = (x, d) => (Math.round(x * 10 ** (d == null ? 2 : d)) / 10 ** (d == null ? 2 : d)).toString().replace('.', ',');
</script>

<script>
'use strict';
/* ================= Toán 11 · hình học không gian: khối dựng sẵn dùng chung =================
   Toạ độ: mặt đáy nằm trong mặt phẳng z = 0, trục z hướng lên. Góc nhìn mặc định [-28°, 22°]:
   điểm càng "sâu" (y lớn) càng lệch sang phải và lên trên, nên cạnh phía sau thành nét đứt như hình vẽ trong SGK. */

/* hình chóp tam giác S.ABC: A bên trái, B phía trước, C bên phải (AC là cạnh khuất); o.top = 'A' đặt S thẳng trên A */
function CHOP3(o) {
  o = o || {};
  const A = o.A || V(-2.4, 0.3, 0), B = o.B || V(0.1, -2.5, 0), C = o.C || V(2.9, 1.3, 0), G = cen(A, B, C), h = o.h || 4.4;
  const S = o.S || (o.top ? add({A, B, C}[o.top], V(0, 0, h)) : add(G, V(o.sx || 0, o.sy || 0, h)));
  return {S, A, B, C, G};
}
const F_CHOP3 = 'SAB SBC SCA ABC';

/* tứ diện ABCD: A ở trên, B trái, C trước, D phải (BD là cạnh khuất) */
function TUDIEN(o) {
  o = o || {};
  return {A: o.A || V(0.2, 0.5, 4.5), B: o.B || V(-2.7, -0.3, 0), C: o.C || V(0.3, -2.3, 0), D: o.D || V(2.9, 1.3, 0)};
}
const F_TD = 'ABC ACD ABD BCD';

/* hình chóp S.ABCD: đáy hình bình hành ABCD rộng a, sâu b, xiên sk (A trước trái, B trước phải, C sau phải, D sau trái);
   S trên tâm O, hoặc o.top = 'A' đặt S thẳng trên A; o.base thay đáy bằng bốn điểm tuỳ ý */
function CHOP4(o) {
  o = o || {};
  const a = o.a || 4.4, b = o.b || 4, sk = o.sk || 0, h = o.h || 4.6;
  const bs = o.base || {A: V(-a / 2 - sk / 2, -b / 2, 0), B: V(a / 2 - sk / 2, -b / 2, 0), C: V(a / 2 + sk / 2, b / 2, 0), D: V(-a / 2 + sk / 2, b / 2, 0)};
  const O = o.base ? xLL(bs.A, bs.C, bs.B, bs.D) : cen(bs.A, bs.B, bs.C, bs.D);
  const S = o.S || (o.top ? add(bs[o.top], V(0, 0, h)) : add(O, V(o.sx || 0, o.sy || 0, h)));
  return Object.assign({S, O}, bs);
}
const F_CHOP4 = 'SAB SBC SCD SDA ABCD';

/* hình hộp ABCD.A'B'C'D': đáy ABCD là hình bình hành rộng a, sâu b, xiên sk; cạnh bên là vectơ v (mặc định thẳng đứng cao h).
   o.up = true: ABCD là mặt trên, A'B'C'D' là mặt dưới (như nhiều hình trong SGK). */
function HOP(o) {
  o = o || {};
  const a = o.a || 4.4, b = o.b || 3.2, sk = o.sk || 0, v = o.v || V(0, 0, o.h || 3.2);
  const lo = {A: V(-a / 2 - sk / 2, -b / 2, 0), B: V(a / 2 - sk / 2, -b / 2, 0), C: V(a / 2 + sk / 2, b / 2, 0), D: V(-a / 2 + sk / 2, b / 2, 0)}, r = {};
  'ABCD'.split('').forEach(k => { const p = o.base ? o.base[k] : lo[k], q = add(p, v); if (o.up) { r[k] = q; r[k + "'"] = p; } else { r[k] = p; r[k + "'"] = q; } });
  return r;
}
const F_HOP = "ABCD A'B'C'D' ABB'A' BCC'B' CDD'C' DAA'D'";

/* hình lăng trụ tam giác ABC.A'B'C' (o.up = true: ABC ở trên) */
function LT3(o) {
  o = o || {};
  const v = o.v || V(0, 0, o.h || 4.2), base = {A: o.A || V(-2.4, 0.2, 0), B: o.B || V(0.3, -2.3, 0), C: o.C || V(2.8, 1.1, 0)}, r = {};
  'ABC'.split('').forEach(k => { const p = base[k], q = add(p, v); if (o.up) { r[k] = q; r[k + "'"] = p; } else { r[k] = p; r[k + "'"] = q; } });
  return r;
}
const F_LT3 = "ABC A'B'C' ABB'A' BCC'B' CAA'C'";

/* mặt phẳng nằm ngang tâm o, nửa cạnh u (theo x), w (theo y): trả về các điểm k1..k4 */
const PH = (k, o, u, w) => PQ(k, o, V(u, 0, 0), V(0, w, 0));
/* mặt phẳng qua ba điểm a, b, c: hình bình hành chứa tam giác, nới rộng theo tỉ lệ s */
function PTRI(k, a, b, c, s) {
  s = s || 1.35; const o = cen(a, b, c), u = mul(sub(b, a), s * 0.75), w0 = sub(c, mid(a, b)), w = mul(w0, s * 0.75);
  return PQ(k, o, u, w);
}
/* điểm chia đoạn AB theo tỉ số t (t = 0 tại A, t = 1 tại B) */
const DIV = (A, B, t) => lerp(A, B, t);
/* hình chiếu vuông góc của p lên đường thẳng ab / mặt phẳng abc */
const HC = (p, a, b, c) => c ? footP(p, a, b, c) : footL(p, a, b);
/* khoảng cách và góc (độ) dùng để hiện số đo trên hình */
const DST = (p, q) => len(sub(p, q));
const GOC = (a, o, b) => Math.acos(clamp3(dot(unit(sub(a, o)), unit(sub(b, o))), -1, 1)) * 180 / Math.PI;
const clamp3 = (v, a, b) => Math.min(b, Math.max(a, v));
/* chữ số kiểu Việt Nam: dấu phẩy thập phân */
const vn = (x, d) => fmtN(x, d == null ? 2 : d);
/* chiếu song song điểm M lên mặt phẳng z = z0 (hoặc y = y0) theo phương v */
const CHIEU = (M, v, z0) => add(M, mul(v, ((z0 || 0) - M[2]) / v[2]));
const CHIEUY = (M, v, y0) => add(M, mul(v, (y0 - M[1]) / v[1]));
/* tứ diện đều cạnh s: A ở trên */
const TDDEU = s => { const r = s / Math.sqrt(3), P = {}; [['B', 195], ['C', 315], ['D', 75]].forEach(([n, a]) => { P[n] = V(r * Math.cos(deg(a)), r * Math.sin(deg(a)), 0); }); P.A = V(0, 0, s * Math.sqrt(2 / 3)); return P; };
</script>
<script>
(() => {
/* ===== Toán 11 · Chương IV. Quan hệ song song trong không gian — SGK Toán 11 tập một, Kết nối tri thức (tr. 70–103) ===== */

        {l: 'Ví dụ 2a', b: [{ds: [[`Đường thẳng $BC$ có hai điểm $B$, $C$ thuộc $(ABC)$.`, `$BC ⊂ (ABC)$.`], [`$M$ thuộc đường thẳng $BC$.`, `Do đó $M ∈ (ABC)$.`]]}]},

    {k: 'kn', lab: 'HĐ5', t: 'Giao tuyến của hai mặt phẳng', min: 5, pg: 'tr. 73',
      b: [`**HĐ5.** Quan sát bể cá (SGK Hình 4.7): mặt nước và một thành bể giao nhau theo một đường thẳng hay không?`,

    {k: 'vd', lab: 'Ví dụ 3 · Luyện tập 3', t: 'Tìm giao tuyến bằng hai điểm chung', min: 8, pg: 'tr. 74',

        {l: 'Luyện tập 3', b: [{ds: [[`$M ∈ AB$ nên mặt phẳng $(SBM)$ chính là $(SAB)$; tương tự $(SCN) = (SAC)$.`, ''], [`$(SAB)$ và $(SAC)$ có hai điểm chung $S$, $A$.`, `$(SBM) ∩ (SCN) = $ ==$SA$==.`]]}]}],

    {k: 'kn', lab: 'HĐ7 · Ví dụ 5 · HĐ8', t: 'Hình chóp', min: 8, pg: 'tr. 75–76',

        {box: [`Cho đa giác lồi $A_1A_2…A_n$ và điểm $S$ nằm ngoài mặt phẳng chứa đa giác đó. Nối $S$ với các đỉnh $A_1$, $A_2$, …, $A_n$ ta được $n$ tam giác $SA_1A_2$, $SA_2A_3$, …, $SA_nA_1$. Hình gồm $n$ tam giác đó và đa giác $A_1A_2…A_n$ gọi là ==hình chóp==, kí hiệu $S.A_1A_2…A_n$.`, `$S$: ==đỉnh==; đa giác $A_1A_2…A_n$: ==mặt đáy==; các tam giác $SA_1A_2$, …: ==mặt bên==; $SA_1$, …, $SA_n$: ==cạnh bên==; $A_1A_2$, …: ==cạnh đáy==.`]},
        {note: `Tên hình chóp gọi theo đa giác đáy: hình chóp tam giác, hình chóp tứ giác,…`, h: 'Chú ý'},
        `**Ví dụ 5.** Hình chóp $S.ABCD$ (Hình 4.11) có bao nhiêu cạnh? **Luyện tập 5.** Gọi tên các mặt bên và mặt đáy của hình chóp $S.ABCD$.`,
        `**HĐ8.** Trong các hình chóp ở HĐ7, hình chóp nào có số mặt ít nhất? Đếm số cạnh và số mặt của hình chóp đó.`],
      st: [{l: 'HĐ7', fp: {v: 0}, b: [{ds: [[`Đều có ==một đỉnh== và ==một mặt đáy== là đa giác; các mặt còn lại là ==tam giác chung đỉnh==.`, '']]}]},
        {l: 'Ví dụ 5', fp: {v: 1}, b: [{ds: [[`4 cạnh bên (đỏ) và 4 cạnh đáy (cam).`, `$SA$, $SB$, $SC$, $SD$, $AB$, $BC$, $CD$, $DA$: ==8 cạnh==.`]]}]},

PP4.ss = [`Dùng hình học phẳng trong một mặt phẳng: ==đường trung bình==, định lí Thalès đảo, cạnh đối của hình bình hành.`, `==Bắc cầu==: hai đường thẳng phân biệt cùng song song với đường thẳng thứ ba thì song song với nhau.`, `==Ba giao tuyến==: ba mặt phẳng đôi một cắt nhau theo ba giao tuyến phân biệt thì ba giao tuyến đồng quy hoặc đôi một song song.`];
PP4.gt2 = [`Tìm ==một điểm chung $M$== của hai mặt phẳng.`, `Nhận ra hai mặt phẳng lần lượt chứa hai đường thẳng song song $a$, $b$.`, `Giao tuyến là ==đường thẳng qua $M$ song song với $a$ (và $b$)==.`];
PP4.cheo = [`Muốn chứng minh $a$, $b$ chéo nhau: giả sử ==$a$, $b$ cùng nằm trong một mặt phẳng== rồi suy ra điều vô lí (chẳng hạn bốn đỉnh của tứ diện đồng phẳng).`];

    {k: 'kn', lab: 'HĐ5 · Ví dụ 4 · Luyện tập 4', t: 'Định lí Thalès trong không gian', min: 9, pg: 'tr. 91',

    {k: 'kn', lab: 'HĐ6', t: 'Hình lăng trụ', min: 7, pg: 'tr. 91–92',
      b: [`**HĐ6.** Thanh sô-cô-la, cục tẩy, chiếc đồng hồ, hộp bút chì màu (SGK) có đặc điểm chung nào với hình lăng trụ đứng tam giác đã học ở lớp 7?`,
        {box: [`Cho hai mặt phẳng song song $(α)$, $(α')$. Trên $(α)$ cho đa giác lồi $A_1A_2…A_n$. Qua các đỉnh vẽ các đường thẳng ==đôi một song song==, cắt $(α')$ tại $A'_1$, $A'_2$, …, $A'_n$. Hình gồm hai đa giác $A_1A_2…A_n$, $A'_1A'_2…A'_n$ và các tứ giác $A_1A'_1A'_2A_2$, …, $A_nA'_nA'_1A_1$ gọi là ==hình lăng trụ==, kí hiệu $A_1A_2…A_n.A'_1A'_2…A'_n$.`, `Các điểm $A_i$, $A'_i$: ==đỉnh==; $A_1A'_1$, …: ==cạnh bên==; $A_1A_2$, …, $A'_1A'_2$, …: ==cạnh đáy==; hai đa giác: ==hai mặt đáy==; các tứ giác: ==mặt bên==.`]},
        {q: `Giải thích tại sao các mặt bên của hình lăng trụ là hình bình hành, từ đó suy ra các cạnh bên đôi một song song và có độ dài bằng nhau.`, a: `Mặt bên $A_1A'_1A'_2A_2$ có $A_1A'_1 // A_2A'_2$; $A_1A_2$ và $A'_1A'_2$ là giao tuyến của mặt bên với hai mặt đáy song song nên song song. Tứ giác có các cặp cạnh đối song song là hình bình hành ⇒ $A_1A'_1 = A_2A'_2 = …$`},
        {note: `Tên hình lăng trụ gọi theo đa giác đáy: lăng trụ tam giác, lăng trụ tứ giác,…`, h: 'Chú ý'}],
      st: [{l: 'HĐ6', b: [{ds: [[`Đều có ==hai đáy là hai đa giác bằng nhau nằm trên hai mặt phẳng song song==, các mặt bên là hình bình hành (hình chữ nhật).`, `Sô-cô-la: lăng trụ tam giác; đồng hồ: lăng trụ ngũ giác; bút chì: lăng trụ lục giác.`]]}]},
        {l: 'Mặt bên là hình bình hành', b: [{ds: [[`Trên hình: các cạnh bên (màu đỏ) song song và bằng nhau; mỗi mặt bên là một hình bình hành.`, '']]}]}],
      fig: {cap: 'Hình lăng trụ A₁A₂…Aₙ.A′₁A′₂…A′ₙ', par: {n: {v: 2, opts: ['Lăng trụ tam giác', 'Lăng trụ tứ giác', 'Lăng trụ ngũ giác'], lab: 'Đáy', sync: false}},
        pts: P => { const n = P.n + 3, r = {}, v = V(0.9, 0.5, 3.4); for (let i = 1; i <= n; i++) { const t = deg(205 + (i - 1) * 360 / n); r['A' + i] = V(2.4 * Math.cos(t) * (1 + 0.15 * Math.sin(3 * t)), 2 * Math.sin(t), 0); r['A' + i + "'"] = add(r['A' + i], v); } return Object.assign(r, PH('_a', V(0.3, 0, 0), 3.6, 2.8), PH('_b', add(V(0.3, 0, 0), v), 3.6, 2.8)); },
        solid: P => { const n = P.n + 3, I = Array.from({length: n}, (_, i) => i + 1); return [I.map(i => 'A' + i).join(''), I.map(i => 'A' + i + "'").join('')].concat(I.map(i => { const j = i % n + 1; return `A${i}A${j}A${j}'A${i}'`; })).join(' '); },
        items: P => { const n = P.n + 3; return [{p: '_a1_a2_a3_a4', c: 3, o: .05, pn: {n: "α'"}}, {p: '_b1_b2_b3_b4', c: 1, o: .05, pn: {n: 'α'}}, {s: Array.from({length: n}, (_, i) => `A${i + 1}A${i + 1}'`).join(' '), c: 4, w: 3, f: 2}]; }}},

/* ======================= BÀI 14. PHÉP CHIẾU SONG SONG ======================= */
/* đa giác tô đặc (che các nét phía sau) trong hình 2D */
const r1d = v => (Math.round(v * 10) / 10).toString();
const SOLID2 = (D, ps, c, o, w) => `<polygon points="${ps.map(p => r1d(p[0]) + ',' + r1d(p[1])).join(' ')}" class="bgr"/>` + D.poly(ps, {c, fill: c, o, w});
/* điểm trong đa giác (tia ngang) */
const INPOLY = (pt, ps) => { let r = false; for (let i = 0, j = ps.length - 1; i < ps.length; j = i++) { const a = ps[i], b = ps[j]; if ((a[1] > pt[1]) !== (b[1] > pt[1]) && pt[0] < (b[0] - a[0]) * (pt[1] - a[1]) / (b[1] - a[1]) + a[0]) r = !r; } return r; };
/* chữ cái dạng nổi vẽ bằng phép chiếu song song (Vận dụng 2) */
const CHU = {E: [[0, 0], [4, 0], [4, 1], [1, 1], [1, 2.5], [3, 2.5], [3, 3.5], [1, 3.5], [1, 5], [4, 5], [4, 6], [0, 6]], L: [[0, 0], [4, 0], [4, 1], [1, 1], [1, 6], [0, 6]],
  N: [[0, 0], [1, 0], [1, 4], [3, 0], [4, 0], [4, 6], [3, 6], [3, 2], [1, 6], [0, 6]], T: [[1.5, 0], [2.5, 0], [2.5, 5], [4, 5], [4, 6], [0, 6], [0, 5], [1.5, 5]]};
function CHU3D(D, poly, x0, y0, cell, off, c) {
  const P = poly.map(([x, y]) => [x0 + x * cell, y0 - y * cell]), Q = P.map(p => [p[0] + off[0], p[1] + off[1]]), n = P.length, faces = [];
  P.forEach((p, i) => { const q = P[(i + 1) % n], dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1; let nv = [dy / L, -dx / L]; const m = [(p[0] + q[0]) / 2 + nv[0] * 2, (p[1] + q[1]) / 2 + nv[1] * 2]; if (INPOLY(m, P)) nv = [-nv[0], -nv[1]];
    if (nv[0] * off[0] + nv[1] * off[1] > 1e-6) faces.push({i, d: ((p[0] + q[0]) / 2) * off[0] + ((p[1] + q[1]) / 2) * off[1]}); });
  faces.sort((a, b) => b.d - a.d);
  let s = '';
  faces.forEach(f => { const j = (f.i + 1) % n; s += SOLID2(D, [P[f.i], P[j], Q[j], Q[f.i]], c, .32, 1.8); });
  return s + SOLID2(D, P, c, .12, 2.2);
}
/* ba hình vẽ hình lập phương (HĐ3) */
function LP2D(D, x, y, s, kind) {
  const F = [[x, y], [x + s, y], [x + s, y + s], [x, y + s]];
  let B = F.map(p => [p[0] - 0.42 * s, p[1] - 0.36 * s]);
  if (kind === 1) B[1] = [B[1][0] + 0.32 * s, B[1][1] + 0.12 * s];
  if (kind === 2) B = F.map(p => [x + s / 2 + (p[0] - x - s / 2) * 0.6, y + s / 2 + (p[1] - y - s / 2) * 0.6 - 0.62 * s]);
  const L = (p, q, dash) => D.line(p[0], p[1], q[0], q[1], {c: 0, w: 2, dash});
  let r = L(F[0], F[1]) + L(F[1], F[2]) + L(F[2], F[3]) + L(F[3], F[0]) + L(B[0], B[1]) + L(F[0], B[0]) + L(F[1], B[1]);
  r += kind === 2 ? L(B[1], B[2], 1) + L(B[2], B[3], 1) + L(B[3], B[0], 1) + L(F[2], B[2], 1) + L(F[3], B[3], 1) : L(B[3], B[0]) + L(F[3], B[3]) + L(B[1], B[2], 1) + L(B[2], B[3], 1) + L(F[2], B[2], 1);
  return r;
}

    {k: 'kn', t: 'Phép chiếu song song · Hình chiếu', min: 7, pg: 'tr. 96',
      b: [{box: [`Cho mặt phẳng $(α)$ và đường thẳng $Δ$ cắt $(α)$. Với mỗi điểm $M$ trong không gian, xác định điểm $M'$ như sau:`, `• Nếu $M$ thuộc $Δ$ thì $M'$ là giao điểm của $(α)$ và $Δ$.`, `• Nếu $M$ không thuộc $Δ$ thì $M'$ là giao điểm của $(α)$ và ==đường thẳng qua $M$ song song với $Δ$==.`, `$M'$ gọi là ==hình chiếu song song== của $M$ trên $(α)$ theo phương $Δ$. Phép đặt tương ứng mỗi điểm $M$ với $M'$ gọi là ==phép chiếu song song== lên $(α)$ theo phương $Δ$; $(α)$ là ==mặt phẳng chiếu==, $Δ$ là ==phương chiếu==.`]},
        {q: `Trong HĐ1, làm thế nào để xác định được bóng của toàn bộ song cửa $CD$ trên sàn nhà?`, a: `Xác định bóng $C'$, $D'$ của hai đầu mút; bóng của song cửa là đoạn thẳng $C'D'$.`},
        {box: `Cho hình $H$. Tập hợp $H'$ các hình chiếu $M'$ của các điểm $M$ thuộc $H$ qua phép chiếu song song được gọi là ==hình chiếu== của $H$ qua phép chiếu song song đó.`},
        {note: `Nếu một đường thẳng ==cùng phương với phương chiếu== thì hình chiếu của nó là ==một điểm==. Từ đây, khi xét hình chiếu của đường thẳng, ta chỉ xét các đường thẳng không cùng phương với phương chiếu.`, h: 'Chú ý'}],
      st: [{l: 'Dựng hình chiếu', b: [{ds: [[`Qua $M$ kẻ đường thẳng song song với $Δ$, cắt $(α)$ tại $M'$.`, `$M'$ là hình chiếu của $M$.`], [`Điểm $N$ nằm trên $Δ$.`, `Hình chiếu $N'$ là giao điểm của $Δ$ với $(α)$.`]]}]},
        {l: 'Hình chiếu của tam giác', b: [{ds: [[`Chiếu từng đỉnh $P$, $Q$, $R$ rồi nối lại.`, `Hình chiếu của tam giác $PQR$ là ==tam giác $P'Q'R'$== (khi mặt phẳng $(PQR)$ không song song với phương chiếu).`]]}]}],

    {k: 'vd', lab: 'Ví dụ 1 · Luyện tập 1 · Vận dụng 1', t: 'Xác định hình chiếu của điểm', min: 7, pg: 'tr. 96–97',

      st: [{l: 'Ví dụ 1a', fp: {v: 0}, b: [{ds: [[`$ABC.A'B'C'$ là hình lăng trụ nên $AA' // BB' // CC'$; $A' ∈ (A'B'C')$.`, `Hình chiếu của $A$ là ==$A'$==.`]]}]},

        {l: 'Luyện tập 1', fp: {v: 1}, b: [{ds: [[`Theo phương $BC$: $AD // BC$ và $D ∈ (DCGH)$.`, `Hình chiếu là ==$D$==.`], [`Theo phương $BG$: $ABGH$ là hình bình hành ($AB // HG$, $AB = HG$) nên $AH // BG$, $H ∈ (DCGH)$.`, `Hình chiếu là ==$H$==.`]]}]},
        {l: 'Vận dụng 1', fp: false, b: [{ds: [[`Bóng vào lưới khi toàn bộ quả bóng đã vượt qua vạch vôi.`, `Hình chiếu (hình tròn) của quả bóng theo phương thẳng đứng ==nằm hoàn toàn phía trong khung thành==, không chạm vạch vôi.`]]}]}],

/* lăng trụ bát giác (tháp tròn): đáy tâm c bán kính r, cao h, nghiêng góc t (độ) theo trục x */
const THAP = (k, c, r, h, t) => { const R = {}, top = V(h * Math.sin(deg(t)), 0, h * Math.cos(deg(t))); for (let i = 0; i < 10; i++) { const a = 2 * Math.PI * i / 10, p = add(c, V(r * Math.cos(a), r * Math.sin(a), 0)); R[k + 'a' + i] = p; R[k + 'b' + i] = add(p, top); } return R; };
const THAPF = k => { const I = Array.from({length: 10}, (_, i) => i); return [I.map(i => k + 'a' + i).join(''), I.map(i => k + 'b' + i).join('')].concat(I.map(i => { const j = (i + 1) % 10; return `${k}a${i}${k}a${j}${k}b${j}${k}b${i}`; })).join(' '); };
/* chóp S.ABC có SA ⊥ (ABC), tam giác ABC vuông tại B */
const CHOPVB = (h) => { const A = V(-2.4, 0.3, 0), B = V(0.1, -2.5, 0), C = add(B, mul(V(2.8, 2.5, 0), 1.1)); return {S: add(A, V(0, 0, h || 4)), A, B, C}; };
/* chóp S.ABCD đáy hình vuông (hoặc chữ nhật a × b) có SA ⊥ (ABCD) */
const CHOPVA = (o) => CHOP4(Object.assign({a: 4, b: 4, top: 'A', h: 4.2}, o || {}));

        {note: `Mặt phẳng đi qua trung điểm của đoạn thẳng $AB$ và vuông góc với đường thẳng $AB$ được gọi là ==mặt phẳng trung trực== của đoạn thẳng $AB$. Đó là ==tập hợp các điểm cách đều $A$, $B$==.`, h: 'Chú ý'}],
      st: [{l: 'HĐ3', fp: {v: 0}, b: [{ds: [[`$a ⊥ d$, $b ⊥ d$ và $d // Δ$ ⇒ $a ⊥ Δ$, $b ⊥ Δ$.`, `$Δ$ vuông góc với hai đường thẳng cắt nhau $a$, $b$ ⇒ ==$Δ ⊥ mp(a, b)$==, mặt phẳng này đi qua $O$.`]]}]},

    {k: 'kn', lab: 'HĐ5 · HĐ6 · Ví dụ 4', t: 'Liên hệ song song – vuông góc (1)', min: 8, pg: 'tr. 34–35',

        `**HĐ6.** Cho hai đường thẳng phân biệt $a$ và $b$ cùng vuông góc với mặt phẳng $(P)$. Xét $O$ là một điểm thuộc $a$ nhưng không thuộc $b$. Gọi $c$ là đường thẳng qua $O$ và song song với $b$ (Hình 7.21). a) $c$ có vuông góc với $(P)$ không? Nêu nhận xét về vị trí tương đối giữa $a$ và $c$. b) Nêu nhận xét về vị trí tương đối giữa hai đường thẳng $a$ và $b$.`,
        {box: [`Nếu đường thẳng $a$ vuông góc với mặt phẳng $(P)$ thì ==các đường thẳng song song với $a$ cũng vuông góc với $(P)$==.`, `==Hai đường thẳng phân biệt cùng vuông góc với một mặt phẳng thì song song với nhau.==`]},
        `**Ví dụ 4.** Cho tứ diện $OABC$ có các cạnh $OA$, $OB$, $OC$ đôi một vuông góc với nhau. Gọi $M$, $N$ tương ứng là trọng tâm của các tam giác $ABC$, $OBC$. Chứng minh rằng đường thẳng $MN$ vuông góc với mặt phẳng $(OBC)$.`],

/* ======================= BÀI 24. PHÉP CHIẾU VUÔNG GÓC. GÓC GIỮA ĐƯỜNG THẲNG VÀ MẶT PHẲNG ======================= */
PP7.goc = [`Muốn tính góc giữa đường thẳng $a$ và mặt phẳng $(P)$ ($a$ cắt $(P)$ tại $O$): lấy $A ∈ a$, tìm ==hình chiếu $H$ của $A$ trên $(P)$==.`, `Góc cần tìm là $\\hat{AOH}$; tính trong tam giác $AOH$ vuông tại $H$: $\\sin = \\frac{AH}{AO}$, $\\tan = \\frac{AH}{OH}$.`, `Thường gặp: $SA ⊥ (ABC)$ ⇒ góc giữa $SB$ và $(ABC)$ là $\\hat{SBA}$.`];
PP7.bdvg = [`Định lí ba đường vuông góc: với $b ⊂ (P)$ và $a'$ là hình chiếu của $a$ trên $(P)$: ==$b ⊥ a ⟺ b ⊥ a'$==.`, `Dùng để chứng minh vuông góc giữa hai đường chéo nhau bằng cách "hạ" một đường xuống mặt phẳng.`];
/* tâm đường tròn ngoại tiếp tam giác ABC nằm trong mặt phẳng z = 0 */
const NGOAI = (A, B, C) => { const ax = A[0], ay = A[1], bx = B[0], by = B[1], cx = C[0], cy = C[1], d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by)), a2 = ax * ax + ay * ay, b2 = bx * bx + by * by, c2 = cx * cx + cy * cy; return V((a2 * (by - cy) + b2 * (cy - ay) + c2 * (ay - by)) / d, (a2 * (cx - bx) + b2 * (ax - cx) + c2 * (bx - ax)) / d, 0); };
/* quay điểm p quanh trục x góc t (radian) */
const QX = (p, t) => V(p[0], p[1] * Math.cos(t) - p[2] * Math.sin(t), p[1] * Math.sin(t) + p[2] * Math.cos(t));

      st: [{l: 'Câu a', b: [{ds: [[`$SA ⊥ (ABC)$ ⇒ $A$ là hình chiếu của $S$ ⇒ $α = \\hat{SBA}$.`, `Tam giác $SAB$ vuông tại $A$: $\\tan α = \\frac{SA}{AB} = \\frac{a}{2a} = $ ==$\\frac{1}{2}$==.`]]}]},
        {l: 'Câu b: hình chiếu của C', b: [{ds: [[`Gọi $M$ là trung điểm $AB$; tam giác $ABC$ cân tại $C$ ⇒ $CM ⊥ AB$; lại có $CM ⊥ SA$.`, `$CM ⊥ (SAB)$ ⇒ góc giữa $SC$ và $(SAB)$ là $\\hat{CSM}$.`]]}]},
        {l: 'Câu b: tính góc', b: [{ds: [[`$SC = \\sqrt{SA^2 + AC^2} = \\sqrt{a^2 + 7a^2} = a\\sqrt{8}$; $AM = a$ ⇒ tam giác $SAM$ vuông cân, $SM = a\\sqrt{2}$.`, ''], [`Tam giác $CMS$ vuông tại $M$: $\\cos\\hat{CSM} = \\frac{SM}{SC} = \\frac{a\\sqrt{2}}{a\\sqrt{8}} = \\frac{1}{2}$.`, `Góc giữa $SC$ và $(SAB)$ bằng ==$60°$==.`]]}]}],
      fig: {cap: 'S.ABC: SA ⊥ (ABC), SA = a, CA = CB = a√7, AB = 2a', view: [-20, 22],
        pts: () => { const a = 1.5, A = V(-a, 0.6, 0), B = V(a, 0.6, 0), M = V(0, 0.6, 0), C = V(0, 0.6 - a * Math.sqrt(6), 0); return {A, B, C, M, S: add(A, V(0, 0, a))}; }, solid: F_CHOP3,
        items: [{ra: 'ASB', c: 6}, {ra: 'ASC', c: 6}, {s: 'SB', c: 4, w: 2.6, f: 1}, {an: 'SBA', c: 2, lab: 'α', f: 1}, {pt: 'M', f: 2}, {s: 'CM', c: 1, w: 2.4, f: 2}, {ra: 'MCA', c: 1, f: 2}, {s: 'SM', c: 3, w: 2.4, f: 2}, {p: 'SAB', c: 3, o: .12, e: 0, f: 2}, {an: 'CSM', c: 2, lab: '60°', f: 3}]}},

    {k: 'vdg', lab: 'Vận dụng', t: 'Trục Trái Đất và mặt phẳng quỹ đạo', min: 7, pg: 'tr. 42',
      b: [`**Vận dụng.** Tâm Trái Đất chuyển động quanh Mặt Trời theo quỹ đạo là một đường elip nhận tâm Mặt Trời làm tiêu điểm. Trong quá trình chuyển động, Trái Đất lại quay quanh trục Bắc Nam. Trục này có phương không đổi và luôn tạo với mặt phẳng chứa quỹ đạo một góc khoảng $66,5°$ (theo nationalgeographic.org). a) Giải thích vì sao hình chiếu của trục Trái Đất trên mặt phẳng quỹ đạo $(P)$ cũng có phương không đổi. b) Giải thích vì sao có hai thời điểm trong năm mà tại đó hình chiếu của trục Trái Đất trên mặt phẳng $(P)$ thuộc đường thẳng nối tâm Mặt Trời và tâm Trái Đất.`],
      st: [{l: 'Câu a', b: [{ds: [[`Các vị trí của trục là các đường thẳng ==song song== (phương không đổi).`, `Phép chiếu vuông góc biến các đường thẳng song song thành các đường thẳng song song (hoặc trùng) ⇒ hình chiếu ==có phương không đổi==.`]]}]},
        {l: 'Câu b', b: [{ds: [[`Hình chiếu của trục luôn có một phương cố định $ℓ$ trong $(P)$; đường nối tâm Mặt Trời – tâm Trái Đất quay đủ một vòng trong một năm.`, ''], [`Đường nối tâm trùng phương $ℓ$ đúng hai lần (khi Trái Đất ở hai đầu đối diện của quỹ đạo).`, `Đó là các ngày ==22/6 và 22/12== (kéo thanh trượt đến $0°$ hoặc $180°$).`]]}]}],
      fig: {cap: 'Trục Trái Đất (đỏ) và hình chiếu của nó trên mặt phẳng quỹ đạo', view: [-24, 30], par: {p: {v: 40, min: 0, max: 355, step: 5, lab: 'Vị trí Trái Đất trên quỹ đạo', fmt: v => v + '°'}},
        pts: P => { const R = names('_o', Array.from({length: 36}, (_, i) => V(3.8 * Math.cos(i * Math.PI / 18), 3 * Math.sin(i * Math.PI / 18), 0))), p = deg(P.p), E = V(3.8 * Math.cos(p), 3 * Math.sin(p), 0), u = mul(V(Math.cos(deg(66.5)), 0, Math.sin(deg(66.5))), 2.2);
          return Object.assign(R, PH('_q', V(0, 0, 0), 4.6, 3.8), {O: V(0, 0, 0), E, N: add(E, u), S: sub(E, u), "N'": add(E, V(u[0], 0, 0)), "S'": sub(E, V(u[0], 0, 0)), _t: V(0, -4.6, 0)}); },
        items: P => { const s = Math.abs(Math.sin(deg(P.p))); return [{p: '_q1_q2_q3_q4', c: 6, o: .06, e: 0, pn: {n: 'P'}}, {p: chain('_o', 36), c: 2, o: 0, w: 1.6}, {pt: 'O E'}, {tx: 'Mặt Trời', at: 'O', dy: -22, c: 2}, {s: 'NS', c: 4, w: 3.4, sd: 1}, {s: "N'S'", c: 1, w: 3, sd: 1}, {s: "NN' SS'", c: 6, w: 1, d: 1}, {s: 'OE', c: 2, w: 1.4, d: 1},
          {nt: s < 0.02 ? 'Hình chiếu của trục nằm trên đường nối tâm (22/6 hoặc 22/12)' : 'Hình chiếu của trục luôn cùng một phương'}]; }}},

    {k: 'kn', lab: 'Khám phá · Trải nghiệm', t: 'Góc với mặt phẳng và góc với đường vuông góc', min: 5, pg: 'tr. 42',
      b: [`**Khám phá.** Cho đường thẳng $Δ$ vuông góc với mặt phẳng $(P)$. Khi đó, với một đường thẳng $a$ bất kì, góc giữa $a$ và $(P)$ có mối quan hệ gì với góc giữa $a$ và $Δ$?`,
        `**Trải nghiệm.** Đo góc giữa một sợi dây kéo căng và mặt bàn hoặc sàn lớp học. (Có thể cho một đầu sợi dây thuộc mặt bàn, mặt sàn để thuận tiện hơn cho việc đo.)`],
      st: [{l: 'Khám phá', b: [{ds: [[`Gọi $a$ cắt $(P)$ tại $O$, $A ∈ a$ có hình chiếu $H$ trên $(P)$: $AH // Δ$.`, `$(a, (P)) = \\hat{AOH}$ và $(a, Δ) = \\hat{OAH}$ — hai góc nhọn của tam giác vuông $AOH$.`], [`Hai góc đó phụ nhau.`, `==$(a, (P)) + (a, Δ) = 90°$== (xem số đo trên hình).`]]}]},
        {l: 'Trải nghiệm', b: [{ds: [[`Buộc một đầu dây trên sàn tại $O$, đầu kia $A$ trên cao; dùng dây dọi tìm hình chiếu $H$ của $A$ trên sàn; đo $AH$ và $OA$.`, `$\\sin\\hat{AOH} = \\frac{AH}{OA}$ ⇒ tra máy tính để ra góc.`]]}]}],
      fig: {cap: 'Hai góc phụ nhau', par: {e: {v: 35, min: 5, max: 85, step: 1, lab: 'Góc giữa a và (P)', fmt: v => v + '°'}},
        pts: P => { const e = deg(P.e), O = V(1.4, 0.4, 0), d = V(-Math.cos(e) * 0.94, -Math.cos(e) * 0.34, Math.sin(e)), A = add(O, mul(d, 3.2)), H = V(A[0], A[1], 0); return Object.assign(PH('_p', V(0, 0, 0), 3.8, 2.6), {O, A, H, _z1: V(2.6, 1.6, -1), _z2: V(2.6, 1.6, 3.6), _t: V(0, -2.4, 3.6)}); },
        items: P => [PLANE('_p', 'P', 1), {l: 'OA', x: [-0.25, 1.2], c: 4, w: 2.8, n: 'a'}, {s: 'AH', c: 3, w: 2}, {ra: 'HAO', c: 3}, {s: 'OH', c: 2, w: 2}, {l: '_z1_z2', x: [0, 1], c: 1, w: 2.4, n: 'Δ'}, {an: 'AOH', c: 2, lab: P.e + '°'}, {an: 'OAH', c: 5, lab: (90 - P.e) + '°'}, {nt: `(a, (P)) + (a, Δ) = ${P.e}° + ${90 - P.e}° = 90°`}]}},

    {k: 'bt', lab: 'Bài 7.10 – 7.12', t: 'Hình chiếu và góc trong hình chóp', min: 10, pg: 'tr. 42',
      b: [`**7.10.** Cho hình chóp $S.ABC$ có $SA ⊥ (ABC)$, tam giác $ABC$ vuông tại $B$. a) Xác định hình chiếu của điểm $S$ trên mặt phẳng $(ABC)$. b) Xác định hình chiếu của tam giác $SBC$ trên mặt phẳng $(ABC)$. c) Xác định hình chiếu của tam giác $SBC$ trên mặt phẳng $(SAB)$.`,
        `**7.11.** Cho hình chóp $S.ABCD$ có đáy là hình vuông $ABCD$ cạnh $a$, $SA ⊥ (ABCD)$ và $SA = a\\sqrt{2}$. a) Tính góc giữa $SC$ và mặt phẳng $(ABCD)$. b) Tính góc giữa $BD$ và mặt phẳng $(SAC)$. c) Tìm hình chiếu của $SB$ trên mặt phẳng $(SAC)$.`,
        `**7.12.** Cho hình chóp $S.ABC$ có $SA ⊥ (ABC)$, tam giác $ABC$ vuông tại $B$, $SA = AB = BC = a$. a) Xác định hình chiếu của $A$ trên mặt phẳng $(SBC)$. b) Tính góc giữa $SC$ và mặt phẳng $(ABC)$.`],
      st: [{l: 'Bài 7.10', fp: {v: 0}, b: [{ds: [[`a) $SA ⊥ (ABC)$ ⇒ hình chiếu của $S$ là ==$A$==. b) Hình chiếu của $SBC$ là ==tam giác $ABC$==.`, ''], [`c) $BC ⊥ AB$, $BC ⊥ SA$ ⇒ $BC ⊥ (SAB)$ ⇒ hình chiếu của $C$ trên $(SAB)$ là $B$.`, `Hình chiếu của tam giác $SBC$ là ==đoạn thẳng $SB$==.`]]}]},
        {l: 'Bài 7.11', fp: {v: 1}, b: [{ds: [[`a) $AC$ là hình chiếu của $SC$; $AC = a\\sqrt{2} = SA$ ⇒ tam giác $SAC$ vuông cân.`, `Góc $\\hat{SCA} = $ ==$45°$==.`], [`b) $BD ⊥ AC$, $BD ⊥ SA$ ⇒ $BD ⊥ (SAC)$.`, `Góc bằng ==$90°$==.`], [`c) $O$ là tâm đáy: $BO ⊥ (SAC)$ ⇒ hình chiếu của $B$ là $O$.`, `Hình chiếu của $SB$ là ==$SO$==.`]]}]},
        {l: 'Bài 7.12', fp: {v: 2}, b: [{ds: [[`a) Kẻ $AH ⊥ SB$ ($H ∈ SB$). $BC ⊥ (SAB)$ nên $BC ⊥ AH$ ⇒ $AH ⊥ (SBC)$. Tam giác $SAB$ vuông cân tại $A$.`, `Hình chiếu của $A$ là ==trung điểm $H$ của $SB$==.`], [`b) $AC = a\\sqrt{2}$, góc cần tìm là $\\hat{SCA}$: $\\tan\\hat{SCA} = \\frac{SA}{AC} = \\frac{1}{\\sqrt{2}}$.`, `$\\hat{SCA} ≈ $ ==$35,26°$==.`]]}]}],
      fig: {cap: 'Bài 7.10 · 7.11 · 7.12', par: {v: {v: 0, opts: ['Bài 7.10', 'Bài 7.11', 'Bài 7.12'], lab: 'Bài'}},
        pts: P => { if (P.v === 1) return CHOPVA({a: 3.2, b: 3.2, h: 3.2 * Math.SQRT2});
          if (P.v === 2) { const A = V(-1.6, 1.2, 0), B = V(0.6, -1, 0), C = add(B, mul(unit(V(2.2, 2.2, 0)), DST(A, B))), S = add(A, V(0, 0, DST(A, B))); return {S, A, B, C, H: mid(S, B)}; } return CHOPVB(4); },
        solid: P => P.v === 1 ? F_CHOP4 : F_CHOP3,
        items: P => P.v === 0 ? [{ra: 'ASB', c: 6}, {ra: 'BAC', c: 6}, {p: 'ABC', c: 1, o: .16, e: 0, f: 1}, {p: 'SAB', c: 3, o: .16, e: 0, f: 1}, {s: 'SB', c: 4, w: 3.2, f: 1}]
          : P.v === 1 ? [{ra: 'ASB', c: 6}, {s: 'AC', c: 2, w: 2.2, f: 2}, {an: 'SCA', c: 2, lab: '45°', f: 2}, {s: 'BD', c: 1, w: 2.4, f: 2}, {pt: 'O', f: 2}, {p: 'SAC', c: 3, o: .14, e: 0, f: 2}, {s: 'SO', c: 4, w: 2.6, f: 2}]
          : [{ra: 'ASB', c: 6}, {ra: 'BAC', c: 6}, {pt: 'H', f: 3}, {s: 'AH', c: 4, w: 2.6, f: 3}, {ra: 'HAS', c: 4, f: 3}, {s: 'AC', c: 2, w: 2, f: 3}, {an: 'SCA', c: 2, lab: '≈ 35,26°', f: 3}]}},

    {k: 'bt', lab: 'Bài 7.13 – 7.15', t: 'Đường xiên · máy bay cất cánh · góc Mặt Trời', min: 8, pg: 'tr. 43',
      b: [`**7.13.** Cho điểm $S$ nằm ngoài mặt phẳng $(P)$, có hình chiếu $H$ trên $(P)$. Với mỗi điểm $M$ bất kì (không trùng $H$) trên $(P)$, ta gọi đoạn thẳng $SM$ là đường xiên, đoạn thẳng $HM$ là hình chiếu trên $(P)$ của đường xiên đó. Chứng minh rằng: a) Hai đường xiên $SM$ và $SM'$ bằng nhau khi và chỉ khi hai hình chiếu $HM$ và $HM'$ tương ứng của chúng bằng nhau; b) Đường xiên $SM$ lớn hơn đường xiên $SM'$ nếu hình chiếu $HM$ lớn hơn hình chiếu $HM'$.`,
        `**7.14.** Trong một khoảng thời gian đầu kể từ khi cất cánh, máy bay bay theo một đường thẳng. ==Góc cất cánh== là góc giữa đường thẳng đó và mặt phẳng nằm ngang nơi cất cánh. Hai máy bay cất cánh và bay thẳng với cùng độ lớn vận tốc trong 5 phút đầu, với các góc cất cánh lần lượt là $10°$, $15°$. Hỏi sau 1 phút kể từ khi cất cánh, máy bay nào ở độ cao so với mặt đất (phẳng, nằm ngang) lớn hơn? (Độ cao của máy bay là khoảng cách từ máy bay đến hình chiếu của nó trên mặt đất.)`,
        `**7.15.** Hãy nêu cách đo góc giữa đường thẳng chứa tia sáng mặt trời và mặt phẳng nằm ngang tại một vị trí và một thời điểm. (Góc giữa tia sáng lúc giữa trưa với mặt phẳng nằm ngang gọi là ==góc Mặt Trời==; nó ảnh hưởng tới sự hấp thụ nhiệt của Trái Đất, tạo nên các mùa.)`],
      st: [{l: 'Bài 7.13', fp: {v: 0}, b: [{ds: [[`Tam giác $SHM$ vuông tại $H$: $SM^2 = SH^2 + HM^2$; tương tự $SM'^2 = SH^2 + HM'^2$.`, ''], [`Hiệu: $SM^2 - SM'^2 = HM^2 - HM'^2$.`, `a) $SM = SM' ⟺ HM = HM'$; b) $HM > HM'$ ⇒ $SM > SM'$.`]]}]},
        {l: 'Bài 7.14', fp: {v: 1}, b: [{ds: [[`Sau 1 phút hai máy bay đi được cùng quãng đường $s$; độ cao $h = s · \\sin α$.`, `$\\sin 15° > \\sin 10°$ ⇒ máy bay có ==góc cất cánh $15°$== ở độ cao lớn hơn.`]]}]},
        {l: 'Bài 7.15', fp: {v: 2}, b: [{ds: [[`Dựng một cọc thẳng đứng (dùng dây dọi) cao $h$ trên mặt đất nằm ngang, đo chiều dài bóng $l$ của cọc.`, `Góc $φ$ cần đo thoả mãn $\\tan φ = \\frac{h}{l}$.`]]}]}],
      fig: {cap: 'Bài 7.13 · 7.14 · 7.15', par: {v: {v: 0, opts: ['Bài 7.13', 'Bài 7.14', 'Bài 7.15'], lab: 'Bài'}},
        pts: P => { if (P.v === 0) { const R = names('_c', Array.from({length: 36}, (_, i) => V(2 * Math.cos(i * Math.PI / 18), 2 * Math.sin(i * Math.PI / 18), 0))); return Object.assign(R, PH('_p', V(0, 0, 0), 3.8, 2.8), {S: V(0, 0, 3), H: V(0, 0, 0), M: V(2 * Math.cos(deg(-30)), 2 * Math.sin(deg(-30)), 0), "M'": V(2 * Math.cos(deg(200)), 2 * Math.sin(deg(200)), 0), N: V(3.2, 1.2, 0)}); }
          if (P.v === 1) { const s = 5, O = V(-2.6, 0, 0), a = deg(10), b = deg(15); return Object.assign(PH('_p', V(0, 0.4, 0), 3.6, 2.2), {O, A: add(O, V(s * Math.cos(a), 0, s * Math.sin(a))), B: add(O, V(s * Math.cos(b), 0.8, s * Math.sin(b))), "A'": add(O, V(s * Math.cos(a), 0, 0)), "B'": add(O, V(s * Math.cos(b), 0.8, 0)), _o2: add(O, V(0, 0.8, 0))}); }
          return Object.assign(PH('_p', V(0, 0, 0), 3.6, 2.4), {G: V(1.6, 0.6, 0), T: V(1.6, 0.6, 2.2), K: V(-1.4, -0.4, 0)}); },
        items: P => P.v === 0 ? [PLANE('_p', 'P', 1), {p: chain('_c', 36), c: 2, o: 0, w: 1.2, d: 1}, {s: 'SH', c: 3, w: 2.2}, {ra: 'HSM', c: 3}, {s: "SM SM'", c: 4, w: 2.4}, {s: "HM HM'", c: 2, w: 2}, {s: 'SN', c: 5, w: 2.4}, {s: 'HN', c: 6, w: 1.8}]
          : P.v === 1 ? [PLANE('_p', '', 3), {s: 'OA', c: 1, w: 2.8, lab: '10°', lt: .5}, {s: 'B_o2', c: 4, w: 2.8, lab: '15°', lt: .5}, {s: "AA' BB'", c: 6, w: 1.6, d: 1}, {pt: "A B"}]
          : [PLANE('_p', 'mặt đất', 3), {s: 'GT', c: 0, w: 4.4, sd: 1}, {s: 'GK', c: 6, w: 4.4, sd: 1}, {s: 'TK', c: 2, w: 1.6, d: 1}, {an: 'TKG', c: 2, lab: 'φ'}, {tx: 'h', at: 'T', dx: 14, dy: 30, c: 0}, {tx: 'l', at: 'K', dx: 60, dy: 12, c: 0}]}},

    {k: 'eb', t: 'Em có biết? Mặt Trời lúc nửa đêm', min: 4, pg: 'tr. 43',
      b: [`Hai thời điểm ở câu b của phần Vận dụng là các ngày ==22 tháng 6== và ==22 tháng 12==, ứng với lúc cực Bắc (cực Nam) của Trái Đất nghiêng về phía Mặt Trời (SGK Hình 7.43).`,
        `Trong cả ngày 22 tháng 6, hình chiếu của trục Trái Đất trên mặt phẳng quỹ đạo gần như chính là đường thẳng $Δ$ nối tâm Trái Đất, tâm Mặt Trời, và cực Bắc nghiêng về phía Mặt Trời; góc giữa trục Trái Đất và đường nối hai tâm xấp xỉ $66,5°$. Mặt Trời chiếu sáng nửa Trái Đất được cắt bởi mặt phẳng vuông góc với $Δ$.`,
        {box: `Vì vậy, trong cả ngày 22 tháng 6, mặc dù Trái Đất quay quanh trục, gần như toàn bộ vùng có ==vĩ độ Bắc lớn hơn $66,5°$== (phía bắc vòng Bắc Cực) luôn được Mặt Trời chiếu sáng — đó là câu trả lời cho câu hỏi mở đầu. Điều tương tự xảy ra với vùng vĩ độ Nam lớn hơn $66,5°$ trong ngày 22 tháng 12.`}]},

    {k: 'tk', t: 'Tổng kết Bài 24', min: 4,

PP7.mpvg = [`Muốn chứng minh $(P) ⊥ (Q)$: tìm trong $(P)$ ==một đường thẳng vuông góc với $(Q)$== (hoặc ngược lại).`, `Muốn có đường thẳng vuông góc với mặt phẳng: trong hai mặt phẳng vuông góc, đường thẳng nằm trong mặt này và vuông góc với giao tuyến thì vuông góc với mặt kia.`, `Hai mặt phẳng cắt nhau cùng vuông góc với mặt phẳng thứ ba thì giao tuyến của chúng vuông góc với mặt phẳng đó.`];
PP7.nhidien = [`Xác định cạnh $a$ của góc nhị diện; tìm một điểm $O$ trên $a$ và hai tia $Ox$, $Oy$ nằm trên hai mặt, ==cùng vuông góc với $a$==.`, `Mẹo: nếu $SA ⊥ (ABCD)$ và kẻ $AH ⊥ BC$ thì $SH ⊥ BC$ (ba đường vuông góc) ⇒ $\\hat{SHA}$ là góc phẳng của $[S, BC, A]$.`, `Tính góc phẳng trong một tam giác vuông. Góc giữa hai mặt phẳng là góc nhọn (hoặc vuông) liên quan.`];
/* lăng trụ đứng n-giác A1…An.A1′…An′ */
const LTN = (base, v) => { const r = {}; base.forEach((p, i) => { r['A' + (i + 1)] = p; r['A' + (i + 1) + "'"] = add(p, v); }); return r; };
const LTNF = n => { const I = Array.from({length: n}, (_, i) => i + 1); return [I.map(i => 'A' + i).join(''), I.map(i => 'A' + i + "'").join('')].concat(I.map(i => { const j = i % n + 1; return `A${i}A${j}A${j}'A${i}'`; })).join(' '); };
const DAGIAC = (n, r, a0) => Array.from({length: n}, (_, i) => V(r * Math.cos(deg(a0 + i * 360 / n)), r * Math.sin(deg(a0 + i * 360 / n)), 0));
/* hình chóp đều S.A1…An */
const CHOPDEU = (n, r, h) => { const R = {S: V(0, 0, h), O: V(0, 0, 0)}; DAGIAC(n, r, n === 4 ? 225 : n === 3 ? 210 : 180).forEach((p, i) => { R['A' + (i + 1)] = p; }); return R; };
const CHOPDEUF = n => { const I = Array.from({length: n}, (_, i) => i + 1); return [I.map(i => 'A' + i).join('')].concat(I.map(i => `SA${i}A${i % n + 1}`)).join(' '); };

    {k: 'vd', lab: 'Ví dụ 3 · Luyện tập 3', t: 'Bốn điểm A, B′, C′, D′ đồng phẳng', min: 9, pg: 'tr. 46–47',
      b: [`**Ví dụ 3.** Cho hình chóp $S.ABCD$ có đáy là hình chữ nhật và $SA ⊥ (ABCD)$. Gọi $B'$, $C'$, $D'$ tương ứng là hình chiếu của $A$ trên $SB$, $SC$, $SD$. Chứng minh rằng: a) $(SBC) ⊥ (SAB)$, $AB' ⊥ (SBC)$, $AD' ⊥ (SCD)$. b) Các điểm $A$, $B'$, $C'$, $D'$ cùng thuộc một mặt phẳng.`,
        `**Luyện tập 3.** Với giả thiết như ở Ví dụ 3, chứng minh rằng: a) Các mặt phẳng $(AB'C'D')$ và $(ABCD)$ cùng vuông góc với $(SAC)$; b) Giao tuyến của hai mặt phẳng $(AB'C'D')$ và $(ABCD)$ là đường thẳng đi qua $A$, nằm trong mặt phẳng $(ABCD)$ và vuông góc với $AC$.`],
      st: [{l: 'Ví dụ 3a', b: [{ds: [[`$BC ⊥ SA$, $BC ⊥ AB$ ⇒ $BC ⊥ (SAB)$ ⇒ ==$(SBC) ⊥ (SAB)$==.`, ''], [`$AB' ⊂ (SAB)$ và vuông góc với giao tuyến $SB$.`, `==$AB' ⊥ (SBC)$==; tương tự ==$AD' ⊥ (SCD)$==.`]]}]},
        {l: 'Ví dụ 3b', b: [{ds: [[`Từ câu a: $AB' ⊥ SC$, $AD' ⊥ SC$; lại có $AC' ⊥ SC$.`, `$AB'$, $AC'$, $AD'$ cùng qua $A$ và vuông góc với $SC$ ⇒ cùng nằm trong một mặt phẳng: ==$A$, $B'$, $C'$, $D'$ đồng phẳng==.`]]}]},
        {l: 'Luyện tập 3', b: [{ds: [[`a) $SC ⊥ (AB'C'D')$ và $SC ⊂ (SAC)$ ⇒ $(SAC) ⊥ (AB'C'D')$; $SA ⊥ (ABCD)$, $SA ⊂ (SAC)$ ⇒ $(SAC) ⊥ (ABCD)$.`, ''], [`b) Hai mặt phẳng cắt nhau cùng vuông góc với $(SAC)$ ⇒ giao tuyến $d$ vuông góc với $(SAC)$.`, `$d$ qua $A$, nằm trong $(ABCD)$ và ==$d ⊥ AC$==.`]]}]}],

    {k: 'kn', lab: 'HĐ5', t: 'Góc nhị diện', min: 8, pg: 'tr. 47',
      b: [`**HĐ5.** Một tài liệu hướng dẫn rằng đối với ghế bàn ăn, nên thiết kế lưng ghế tạo với mặt ghế một góc có số đo từ $100°$ đến $105°$. Trong Hình 7.51, các tia $Ox$, $Oy$ được vẽ tương ứng trên mặt ghế, lưng ghế đồng thời vuông góc với giao tuyến $a$ của mặt ghế và lưng ghế. a) Theo tài liệu nói trên, góc nào trong hình nên có số đo từ $100°$ đến $105°$? b) Nếu thiết kế theo hướng dẫn đó thì góc giữa mặt phẳng chứa mặt ghế và mặt phẳng chứa lưng ghế có thể nhận số đo từ bao nhiêu đến bao nhiêu độ?`,
        {box: [`Hình gồm hai nửa mặt phẳng $(P)$, $(Q)$ có chung bờ $a$ được gọi là một ==góc nhị diện==, kí hiệu $[P, a, Q]$. Đường thẳng $a$ và các nửa mặt phẳng $(P)$, $(Q)$ là ==cạnh== và các ==mặt== của góc nhị diện.`, `Từ một điểm $O$ bất kì thuộc cạnh $a$, vẽ các tia $Ox$, $Oy$ tương ứng thuộc $(P)$, $(Q)$ và ==vuông góc với $a$==. Góc $xOy$ gọi là một ==góc phẳng của góc nhị diện== (góc phẳng nhị diện). Số đo của góc $xOy$ không phụ thuộc vào vị trí của $O$ trên $a$, gọi là ==số đo của góc nhị diện==.`]},
        {note: [`Số đo của góc nhị diện nhận giá trị từ $0°$ đến $180°$; góc nhị diện gọi là vuông, nhọn, tù nếu số đo tương ứng bằng, nhỏ hơn, lớn hơn $90°$.`, `Với $M$, $N$ không thuộc $a$, kí hiệu $[M, a, N]$ là góc nhị diện có cạnh $a$ và các mặt tương ứng chứa $M$, $N$.`, `Hai mặt phẳng cắt nhau tạo thành bốn góc nhị diện; nếu một góc là vuông thì các góc còn lại cũng vuông.`, `Mặt phẳng chứa góc phẳng nhị diện vuông góc với cạnh $a$.`], h: 'Chú ý'},
        {pp: PP7.nhidien, h: 'Phương pháp: xác định và tính góc nhị diện'}],
      st: [{l: 'HĐ5a', b: [{ds: [[`$Ox$, $Oy$ cùng vuông góc với giao tuyến $a$.`, `Góc ==$xOy$== nên có số đo từ $100°$ đến $105°$.`]]}]},
        {l: 'HĐ5b', b: [{ds: [[`Góc giữa hai mặt phẳng là góc nhọn: bù với $\\hat{xOy}$.`, `Từ ==$75°$ đến $80°$==.`]]}]},
        {l: 'Góc phẳng không phụ thuộc O', b: [{ds: [[`Lấy thêm điểm $O'$ trên cạnh $a$ và dựng góc phẳng $x'O'y'$.`, `$\\hat{x'O'y'} = \\hat{xOy}$ (hai góc có các cạnh tương ứng song song, cùng chiều).`]]}]}],
      fig: {cap: 'Góc nhị diện [P, a, Q] và góc phẳng xOy', view: [-35, 22], par: {t: {v: 102, min: 10, max: 175, step: 1, lab: 'Số đo góc nhị diện', fmt: v => v + '°'}},
        pts: P => { const t = deg(P.t), d = V(Math.cos(t), 0, Math.sin(t)); return {_a1: V(0, -2.6, 0), _a2: V(0, 2.6, 0), _p3: V(3, 2.6, 0), _p4: V(3, -2.6, 0), _q3: add(mul(d, 3), V(0, 2.6, 0)), _q4: add(mul(d, 3), V(0, -2.6, 0)), O: V(0, 0.8, 0), X: V(2.2, 0.8, 0), Y: add(V(0, 0.8, 0), mul(d, 2.2)), "O'": V(0, -1.4, 0), "X'": V(2.2, -1.4, 0), "Y'": add(V(0, -1.4, 0), mul(d, 2.2))}; },
        hide: "X Y X' Y'",
        items: P => [{p: '_a1_a2_p3_p4', c: 1, o: .12, pn: {n: 'P', at: '_p4_p3_a2_a1', t: .2}}, {p: '_a1_a2_q3_q4', c: 3, o: .12, pn: {n: 'Q', at: '_q4_q3_a2_a1', t: .2}}, {l: '_a1_a2', x: [-0.05, 1.05], c: 4, w: 3, n: 'a'}, {pt: 'O'}, {s: 'OX OY', c: 2, w: 2.6}, {tx: 'x', at: 'X', dy: -14, c: 2}, {tx: 'y', at: 'Y', dx: 10, dy: -10, c: 2}, {ra: 'OX_a2', c: 2}, {ra: 'OY_a2', c: 2}, {an: 'XOY', c: 5, lab: P.t + '°'},
          {pt: "O'", f: 3}, {s: "O'X' O'Y'", c: 5, w: 2.2, f: 3}, {an: "X'O'Y'", c: 5, lab: P.t + '°', f: 3}]}},

    {k: 'vd', lab: 'Ví dụ 4 · Luyện tập 4', t: 'Tính số đo góc nhị diện', min: 10, pg: 'tr. 48',
      b: [`**Ví dụ 4.** Cho hình chóp $S.ABCD$ có $SA ⊥ (ABCD)$, đáy $ABCD$ là hình thoi có cạnh bằng $a$, $AC = a$, $SA = \\frac{1}{2}a$. Gọi $O$ là giao điểm của hai đường chéo hình thoi $ABCD$ và $H$ là hình chiếu của $O$ trên $SC$. a) Tính số đo của các góc nhị diện $[B, SA, D]$; $[S, BD, A]$; $[S, BD, C]$. b) Chứng minh rằng $\\hat{BHD}$ là một góc phẳng của góc nhị diện $[B, SC, D]$.`,
        `**Luyện tập 4.** Cho hình chóp $S.ABC$ có $SA ⊥ (ABC)$, $AB = AC = a$, $\\hat{BAC} = 120°$, $SA = \\frac{a}{2\\sqrt{3}}$. Gọi $M$ là trung điểm của $BC$. a) Chứng minh rằng $\\hat{SMA}$ là một góc phẳng của góc nhị diện $[S, BC, A]$. b) Tính số đo của góc nhị diện $[S, BC, A]$.`],
      st: [{l: 'Ví dụ 4: [B, SA, D]', fp: {v: 0}, b: [{ds: [[`$SA ⊥ (ABCD)$ ⇒ $AB$, $AD$ vuông góc với $SA$ ⇒ $\\hat{BAD}$ là góc phẳng của $[B, SA, D]$.`, ''], [`Hình thoi cạnh $a$ có $AC = a$ ⇒ các tam giác $ABC$, $ACD$ đều ⇒ $\\hat{BAD} = 120°$.`, `$[B, SA, D] = $ ==$120°$==.`]]}]},
        {l: 'Ví dụ 4: [S, BD, A], [S, BD, C]', fp: {v: 0}, b: [{ds: [[`$BD ⊥ AC$, $BD ⊥ SA$ ⇒ $BD ⊥ (SAC)$ ⇒ $AC$, $SO$ vuông góc với $BD$: $\\hat{AOS}$, $\\hat{COS}$ là góc phẳng của $[S, BD, A]$, $[S, BD, C]$.`, ''], [`Tam giác $SAO$ vuông tại $A$, $SA = \\frac{1}{2}a = AO$ ⇒ $\\hat{AOS} = 45°$, $\\hat{COS} = 180° - 45° = 135°$.`, `==$45°$ và $135°$==.`]]}]},
        {l: 'Ví dụ 4b', fp: {v: 0}, b: [{ds: [[`$BD ⊥ (SAC)$ ⇒ $BD ⊥ SC$; lại có $OH ⊥ SC$.`, `$SC ⊥ (BHD)$ ⇒ $HB$, $HD$ vuông góc với $SC$ ⇒ ==$\\hat{BHD}$ là góc phẳng của $[B, SC, D]$==.`]]}]},
        {l: 'Luyện tập 4', fp: {v: 1}, b: [{ds: [[`a) Tam giác $ABC$ cân tại $A$ ⇒ $AM ⊥ BC$; theo định lí ba đường vuông góc $SM ⊥ BC$.`, `$\\hat{SMA}$ là góc phẳng của $[S, BC, A]$.`], [`b) $AM = AB\\cos 60° = \\frac{a}{2}$; $\\tan\\hat{SMA} = \\frac{SA}{AM} = \\frac{a}{2\\sqrt{3}} : \\frac{a}{2} = \\frac{1}{\\sqrt{3}}$.`, `$[S, BC, A] = $ ==$30°$==.`]]}]}],
      fig: {cap: 'Ví dụ 4 · Luyện tập 4', par: {v: {v: 0, opts: ['Ví dụ 4', 'Luyện tập 4'], lab: 'Bài'}},
        pts: P => { if (P.v) { const a = 3.4, A = V(-1, 0, 0), M = V(0.7, 0, 0); return {A, M, B: V(0.7, -a * Math.sqrt(3) / 2, 0), C: V(0.7, a * Math.sqrt(3) / 2, 0), S: add(A, V(0, 0, a / (2 * Math.sqrt(3))))}; }
          const T = {A: V(-1.5, 0, 0), C: V(1.5, 0, 0), B: V(0, -2.598, 0), D: V(0, 2.598, 0), O: V(0, 0, 0), S: V(-1.5, 0, 1.5)}; return Object.assign(T, {H: footL(T.O, T.S, T.C)}); },

          : [{ra: 'ASB', c: 6}, {an: 'BAD', c: 2, lab: '120°', f: 1, u: 2}, {s: 'AC BD', c: 6, w: 1.4, f: 2}, {pt: 'O', f: 2}, {s: 'SO', c: 4, w: 2.4, f: 2}, {an: 'AOS', c: 2, lab: '45°', f: 2, u: 3}, {an: 'COS', c: 5, lab: '135°', f: 2, u: 3}, {pt: 'H', f: 3}, {s: 'OH HB HD', c: 1, w: 2.2, f: 3}, {ra: 'HOS', c: 1, f: 3}, {an: 'BHD', c: 2, f: 3}]}},

    {k: 'vdg', lab: 'Vận dụng 1', t: 'Cửa sổ hình tròn mở theo bản lề trên', min: 5, pg: 'tr. 48',
      b: [`**Vận dụng 1.** Trong cửa sổ ở Hình 7.56, cánh và khung cửa là các nửa hình tròn có đường kính 80 cm, bản lề được đính ở điểm chính giữa $O$ của các cung tròn khung và cánh cửa. Khi cửa mở, đường kính của khung và đường kính của cánh song song với nhau và cách nhau một khoảng $d$; khi cửa đóng, hai đường kính đó trùng nhau. Hãy tính số đo của góc nhị diện có hai nửa mặt phẳng tương ứng chứa cánh, khung cửa khi $d = 40$ cm.`],
      st: [{l: 'Góc phẳng nhị diện', b: [{ds: [[`Cạnh của góc nhị diện là tiếp tuyến chung tại $O$ của hai cung (song song với hai đường kính). Gọi $I$, $I'$ là tâm khung, tâm cánh: $OI$, $OI'$ cùng vuông góc với cạnh.`, `$\\hat{IOI'}$ là góc phẳng nhị diện.`]]}]},
        {l: 'Tính góc', b: [{ds: [[`$OI = OI' = 40$ cm (bán kính), $II' = d = 40$ cm ⇒ tam giác $OII'$ đều.`, `Góc nhị diện bằng ==$60°$== (kéo thanh trượt để kiểm tra).`]]}]}],

        items: P => [{p: chain('_k', 19), c: 1, o: .14, w: 2.4}, {p: chain('_c', 19), c: 2, o: .18, w: 2.4}, {l: '_e1_e2', x: [0, 1], c: 0, w: 2, n: 'a', d: 1}, {s: "OI OI'", c: 4, w: 2.4}, {s: "II'", c: 5, w: 2, d: 1}, {an: "IOI'", c: 4, lab: P.t + '°'}, {nt: `d = II′ ≈ ${Math.round(80 * Math.sin(deg(P.t) / 2))} cm`}]}},

    {k: 'kn', t: 'Kinh độ và vĩ độ', min: 6, pg: 'tr. 48–49',
      b: [`Trở lại vấn đề mở đầu. Trên Trái Đất, mỗi ==kinh tuyến== là một nửa đường tròn có đường kính là trục Trái Đất (đoạn nối cực Bắc và cực Nam). ==Kinh tuyến gốc== là kinh tuyến đi qua Đài Thiên văn Greenwich ở London; mặt phẳng chứa kinh tuyến gốc chia Trái Đất làm hai nửa Đông và Tây, nước ta nằm ở nửa Đông.`,

        `Đi kèm số đo kinh độ có chữ $E$ hoặc $W$ (nửa Đông, nửa Tây), đi kèm vĩ độ có chữ $N$ hoặc $S$ (bán cầu Bắc, bán cầu Nam). Chẳng hạn, Bia Chủ quyền đảo Song Tử Tây thuộc đặc khu Trường Sa, tỉnh Khánh Hoà có vị trí: ==11°25′55″N, 114°8′00″E== (theo baokhanhhoa.vn).`],
      st: [{l: 'Đọc trên hình', b: [{ds: [[`$λ$: góc phẳng của góc nhị diện giữa nửa mặt phẳng chứa kinh tuyến gốc (đỏ) và nửa mặt phẳng chứa kinh tuyến qua $P$ — đo trên mặt phẳng xích đạo.`, `$θ$: góc giữa $OP$ và mặt phẳng xích đạo. Kéo các thanh trượt để đặt $P$ tại Song Tử Tây (≈ $114°E$, $11°N$).`]]}]}],

        pts: P => { const R0 = 3, f0 = deg(-115), L = deg(P.l), T = deg(P.th), pt = (lon, lat) => V(R0 * Math.cos(lat) * Math.cos(f0 + lon), R0 * Math.cos(lat) * Math.sin(f0 + lon), R0 * Math.sin(lat)), R = {O: V(0, 0, 0), N: V(0, 0, R0), S: V(0, 0, -R0)};

    {k: 'kn', lab: 'HĐ11 · HĐ12 · Ví dụ 7 · Luyện tập 5', t: 'Hình chóp đều', min: 9, pg: 'tr. 51',
      b: [`**HĐ11.** Tháp lớn tại Bảo tàng Louvre ở Paris (kết cấu kính và kim loại) có dạng hình chóp với đáy là hình vuông có cạnh bằng 34 m, các cạnh bên bằng nhau và có độ dài xấp xỉ 32,3 m (theo Wikipedia.org). Giải thích vì sao hình chiếu của đỉnh trên đáy là tâm của đáy tháp.`,
        {box: `==Hình chóp đều== là hình chóp có ==đáy là đa giác đều== và ==các cạnh bên bằng nhau==.`},
        `**HĐ12.** Cho hình chóp $S.A_1A_2…A_n$; $O$ là hình chiếu của $S$ trên mặt đáy. a) Trường hợp hình chóp đều, vị trí của $O$ có gì đặc biệt? b) Nếu đáy là đa giác đều và $O$ là tâm của đáy thì hình chóp có gì đặc biệt?`,
        {box: `Một hình chóp là đều ==khi và chỉ khi== đáy của nó là một đa giác đều và ==hình chiếu của đỉnh trên mặt phẳng đáy là tâm của mặt đáy==.`},
        `**Ví dụ 7.** Chứng minh rằng một hình chóp là đều khi và chỉ khi đáy của nó là một đa giác đều và các cạnh bên tạo với mặt phẳng đáy các góc bằng nhau.`,
        `**Luyện tập 5.** Cho hình chóp tam giác đều $S.ABC$, cạnh đáy bằng $a$, cạnh bên bằng $a\\sqrt{\\frac{5}{12}}$. Tính số đo của góc nhị diện $[S, BC, A]$.`],
      st: [{l: 'HĐ11 · HĐ12', fp: {v: 1}, b: [{ds: [[`Các tam giác $SOA_i$ vuông tại $O$, chung $SO$, cạnh huyền $SA_i$ bằng nhau ⇒ $OA_1 = OA_2 = …$`, `$O$ cách đều các đỉnh của đa giác đều ⇒ ==$O$ là tâm đáy==; ngược lại, $O$ là tâm thì $SA_i = \\sqrt{SO^2 + OA_i^2}$ bằng nhau ⇒ hình chóp đều.`]]}]},
        {l: 'Ví dụ 7', fp: {v: 1}, b: [{ds: [[`Chóp đều ⇒ $O$ là tâm ⇒ các tam giác vuông $SOA_i$ bằng nhau ⇒ $\\hat{SA_1O} = \\hat{SA_2O} = …$ (góc giữa cạnh bên và đáy bằng nhau).`, ''], [`Ngược lại, các góc $\\hat{SA_iO}$ bằng nhau ⇒ các tam giác vuông $SOA_i$ bằng nhau (chung $SO$) ⇒ $SA_1 = SA_2 = …$; đáy đều ⇒ chóp đều.`, '']]}]},
        {l: 'Luyện tập 5', fp: {v: 0}, b: [{ds: [[`$O$ là tâm tam giác đều $ABC$, $M$ là trung điểm $BC$: $OA = \\frac{a}{\\sqrt{3}}$, $OM = \\frac{a}{2\\sqrt{3}}$; $SO^2 = \\frac{5a^2}{12} - \\frac{a^2}{3} = \\frac{a^2}{12}$ ⇒ $SO = \\frac{a}{2\\sqrt{3}}$.`, ''], [`$OM ⊥ BC$, $SM ⊥ BC$ ⇒ $\\hat{SMO}$ là góc phẳng của $[S, BC, A]$; $\\tan\\hat{SMO} = \\frac{SO}{OM} = 1$.`, `$[S, BC, A] = $ ==$45°$==.`]]}]}],
      fig: {cap: 'Hình chóp đều: hình chiếu của đỉnh là tâm đáy', par: {v: {v: 1, opts: ['Chóp tam giác đều', 'Chóp tứ giác đều', 'Chóp lục giác đều'], lab: 'Hình'}},
        pts: P => { if (P.v === 0) { const a = 3.6, r = a / Math.sqrt(3), R = {S: V(0, 0, a / (2 * Math.sqrt(3))), O: V(0, 0, 0)}; [['A', 210], ['B', 330], ['C', 90]].forEach(([n, t]) => { R[n] = V(r * Math.cos(deg(t)), r * Math.sin(deg(t)), 0); }); R.M = mid(R.B, R.C); return R; }
          return CHOPDEU(P.v === 1 ? 4 : 6, 2.6, 4.2); },
        solid: P => P.v === 0 ? F_CHOP3 : CHOPDEUF(P.v === 1 ? 4 : 6),
        items: P => { if (P.v === 0) return [{pt: 'O M'}, {s: 'SO OM SM', c: 4, w: 2.2, f: 3}, {ra: 'OSM', c: 4, f: 3}, {an: 'SMO', c: 2, lab: '45°', f: 3}, {tk: 'SA SB SC', c: 2}];

    {k: 'kn', lab: 'HĐ13 · Ví dụ 8', t: 'Hình chóp cụt đều', min: 8, pg: 'tr. 52–53',
      b: [`**HĐ13.** Cho hình chóp đều $S.A_1A_2…A_n$. Một mặt phẳng không đi qua $S$ và song song với mặt phẳng đáy, cắt các cạnh $SA_1$, …, $SA_n$ tương ứng tại $B_1$, …, $B_n$. a) Giải thích vì sao $S.B_1B_2…B_n$ là một hình chóp đều. b) Gọi $H$ là tâm của đa giác đều $A_1A_2…A_n$. Chứng minh rằng $SH$ đi qua tâm $K$ của đa giác đều $B_1B_2…B_n$ và $HK$ vuông góc với các mặt phẳng $(A_1A_2…A_n)$, $(B_1B_2…B_n)$.`,
        {box: [`Hình gồm các đa giác đều $A_1A_2…A_n$, $B_1B_2…B_n$ và các hình thang cân $A_1A_2B_2B_1$, …, $A_nA_1B_1B_n$ được gọi là ==hình chóp cụt đều== (tạo thành từ hình chóp đều sau khi cắt đi hình chóp đều $S.B_1B_2…B_n$), kí hiệu $A_1A_2…A_n.B_1B_2…B_n$.`, `Hai đa giác đều: ==hai mặt đáy==; các hình thang cân: ==mặt bên==; $A_1B_1$, …: ==cạnh bên==; đoạn $HK$ nối hai tâm đáy: ==đường cao==, độ dài của nó là ==chiều cao== của hình chóp cụt đều.`]},
        {q: `Hình chóp cụt đều có các cạnh bên bằng nhau hay không?`, a: `Có: $A_iB_i = SA_i - SB_i$ với $SA_i$ bằng nhau và $SB_i$ bằng nhau.`},
        `**Ví dụ 8.** Cho hình chóp cụt đều $ABC.A'B'C'$ có chiều cao bằng $h$, các đáy là các tam giác đều $ABC$, $A'B'C'$ có cạnh tương ứng là $a$, $a'$ ($a > a'$). Tính độ dài các cạnh bên của hình chóp cụt đều.`],
      st: [{l: 'HĐ13', fp: {v: 0}, b: [{ds: [[`a) $B_iB_{i+1} // A_iA_{i+1}$ và $\\frac{SB_i}{SA_i}$ bằng nhau (Thalès) ⇒ $B_1B_2…B_n$ là đa giác đều, $SB_1 = … = SB_n$ ⇒ $S.B_1…B_n$ là hình chóp đều.`, ''], [`b) $SH ⊥ (A_1…A_n)$, cũng vuông góc với mặt phẳng song song $(B_1…B_n)$ tại $K$; $K$ là hình chiếu của đỉnh $S$ của chóp đều $S.B_1…B_n$ nên là tâm của $B_1…B_n$.`, `$HK$ ==vuông góc với cả hai đáy==.`]]}]},
        {l: 'Ví dụ 8', fp: {v: 1}, b: [{ds: [[`Gọi $H$, $H'$ là tâm hai đáy: $HH' ⊥$ hai đáy, $HA = \\frac{a}{\\sqrt{3}}$, $H'A' = \\frac{a'}{\\sqrt{3}}$. Hình thang $AHH'A'$ vuông tại $H$, $H'$; kẻ $A'M ⊥ HA$.`, ''], [`$AA'^2 = A'M^2 + MA^2 = h^2 + \\left(\\frac{a - a'}{\\sqrt{3}}\\right)^2$.`, `==$AA' = \\sqrt{h^2 + \\frac{(a - a')^2}{3}}$== (máy tính lại trên hình).`]]}]}],
      fig: {cap: 'Hình chóp cụt đều', par: {v: {v: 0, opts: ['Chóp cụt lục giác (HĐ13)', 'Chóp cụt tam giác (Ví dụ 8)'], lab: 'Hình'}, t: {v: 0.5, min: 0.25, max: 0.8, step: 0.05, lab: 'Vị trí mặt cắt', fmt: v => vn(v)}},

/* ======================= BÀI 26. KHOẢNG CÁCH ======================= */
PP7.kc = [`$d(M, (P))$: dựng ==hình chiếu $H$ của $M$ trên $(P)$== rồi tính $MH$. Mẹo hay dùng: nếu $SA ⊥ (ABC)$, kẻ $AK ⊥ BC$, $AH ⊥ SK$ thì $AH ⊥ (SBC)$ và $d(A, (SBC)) = AH$, với $\\frac{1}{AH^2} = \\frac{1}{SA^2} + \\frac{1}{AK^2}$.`, `Đường thẳng (mặt phẳng) song song với $(P)$: khoảng cách bằng khoảng cách từ ==một điểm bất kì== trên nó đến $(P)$ — chọn điểm thuận tiện.`, `Tứ diện $OABC$ có $OA$, $OB$, $OC$ đôi một vuông góc: $\\frac{1}{d^2} = \\frac{1}{OA^2} + \\frac{1}{OB^2} + \\frac{1}{OC^2}$ với $d = d(O, (ABC))$.`];
PP7.cheo = [`Cách 1: dựng ==đường vuông góc chung== $MN$ ($M ∈ a$, $N ∈ b$, $MN ⊥ a$, $MN ⊥ b$) rồi tính $MN$.`, `Cách 2: tìm mặt phẳng $(P)$ chứa $b$ và song song với $a$; khi đó $d(a, b) = d(a, (P)) = d(M, (P))$ với $M ∈ a$ tuỳ ý.`, `Cách 3: khoảng cách giữa hai mặt phẳng song song lần lượt chứa $a$, $b$. Trường hợp đặc biệt: $a ⊥ (P)$ tại $O$, $b ⊂ (P)$ thì $d(a, b) = d(O, b)$.`];
PP7.tt = [`Xác định ==đáy== và ==đường cao== (đoạn vuông góc từ đỉnh đến mặt phẳng đáy); thường chọn đáy sao cho chân đường cao dễ thấy (cạnh vuông góc với đáy, hình chóp đều có chân đường cao là tâm đáy, mặt bên vuông góc với đáy…).`, `$V_{chóp} = \\frac{1}{3}Sh$; $V_{lăng trụ} = Sh$; $V_{chóp cụt đều} = \\frac{1}{3}(S + S' + \\sqrt{SS'})h$.`, `Có thể đổi đỉnh, đổi đáy: tứ diện tính theo bất kì mặt nào; khối hộp tính theo bất kì mặt nào.`];

        {note: [`$d(M, a) = 0 ⟺ M ∈ a$; $d(M, (P)) = 0 ⟺ M ∈ (P)$.`, `Khoảng cách từ $M$ đến $a$ (đến $(P)$) là ==khoảng cách nhỏ nhất== giữa $M$ và một điểm thuộc $a$ (thuộc $(P)$).`, `Khoảng cách từ đỉnh đến mặt phẳng chứa mặt đáy của một hình chóp gọi là ==chiều cao của hình chóp== đó.`], h: 'Chú ý · Nhận xét'}],
      st: [{l: 'HĐ1', b: [{ds: [[`Nếu $K ≠ H$: tam giác $MHK$ vuông tại $H$ nên $MK$ là cạnh huyền.`, `$MK > MH$; dấu bằng khi $K ≡ H$. Kéo điểm $K$ để thấy $MK$ nhỏ nhất khi $K$ trùng $H$.`]]}]}],
      fig: {cap: 'MK ≥ MH với mọi K trên (P)', par: {k: {v: 40, min: 0, max: 359, step: 1, lab: 'Vị trí của K', fmt: v => v + '°'}, r: {v: 1.8, min: 0, max: 2.4, step: 0.1, lab: 'Khoảng cách HK', fmt: v => vn(v, 1)}},
        pts: P => { const H = V(0.2, 0.2, 0), K = add(H, V(P.r * Math.cos(deg(P.k)), P.r * Math.sin(deg(P.k)) * 0.8, 0)); return Object.assign(PH('_p', V(0, 0, 0), 3.6, 2.6), {M: V(0.2, 0.2, 2.8), H, K, _t: V(0, -2.4, 3.6)}); },
        items: P => [PLANE('_p', 'P', 1), {s: 'MH', c: 4, w: 2.8}, {ra: 'HMK', c: 4}, {s: 'MK', c: 2, w: 2.2}, {s: 'HK', c: 3, w: 1.8}, {nt: `MH = 2,8  ·  MK = ${vn(Math.sqrt(2.8 * 2.8 + DST(V(0, 0, 0), V(P.r * Math.cos(deg(P.k)), P.r * Math.sin(deg(P.k)) * 0.8, 0)) ** 2))}`}]}},

    {k: 'vd', lab: 'Ví dụ 1 · Luyện tập 1', t: 'Chiều cao hình chóp đều · khoảng cách trong lăng trụ đứng', min: 8, pg: 'tr. 55',
      b: [`**Ví dụ 1.** Cho hình chóp đều $S.ABC$. Biết độ dài cạnh đáy, cạnh bên tương ứng bằng $a$, $b$ ($a < b\\sqrt{3}$). Tính chiều cao của hình chóp.`,
        `**Luyện tập 1.** Cho hình lăng trụ đứng $ABC.A'B'C'$ có $ABC$ là tam giác vuông cân tại $A$, $AB = a$, $AA' = h$ (Hình 7.77). a) Tính khoảng cách từ $A$ đến mặt phẳng $(BCC'B')$. b) Tam giác $ABC'$ là tam giác gì? Tính khoảng cách từ $A$ đến $BC'$.`, {pp: PP7.kc, h: 'Phương pháp: khoảng cách đến mặt phẳng'}],
      st: [{l: 'Ví dụ 1', fp: {v: 0}, b: [{ds: [[`Hình chiếu của $S$ trên $(ABC)$ là tâm $O$ của tam giác đều; $OA = \\frac{a}{\\sqrt{3}}$.`, ''], [`Tam giác $SOA$ vuông tại $O$.`, `==$SO = \\sqrt{b^2 - \\frac{a^2}{3}}$==.`]]}]},
        {l: 'Luyện tập 1a', fp: {v: 1}, b: [{ds: [[`Kẻ $AH ⊥ BC$ ($H$ là trung điểm $BC$); $BB' ⊥ (ABC)$ ⇒ $AH ⊥ BB'$ ⇒ $AH ⊥ (BCC'B')$.`, `$d(A, (BCC'B')) = AH = \\frac{BC}{2} = $ ==$\\frac{a\\sqrt{2}}{2}$==.`]]}]},
        {l: 'Luyện tập 1b', fp: {v: 1}, b: [{ds: [[`$AB ⊥ AC$, $AB ⊥ AA'$ ⇒ $AB ⊥ (ACC'A')$ ⇒ $AB ⊥ AC'$: tam giác $ABC'$ ==vuông tại $A$==.`, ''], [`$AC' = \\sqrt{a^2 + h^2}$, $BC' = \\sqrt{2a^2 + h^2}$; đường cao $AK$ của tam giác vuông.`, `$d(A, BC') = \\frac{AB · AC'}{BC'} = $ ==$\\frac{a\\sqrt{a^2 + h^2}}{\\sqrt{2a^2 + h^2}}$==.`]]}]}],
      fig: {cap: 'Ví dụ 1 · Luyện tập 1', par: {v: {v: 0, opts: ['Ví dụ 1', 'Luyện tập 1'], lab: 'Bài'}},

          const a = 3.8, b = 3.6, r = a / Math.sqrt(3), R = {O: V(0, 0, 0)}; [['A', 210], ['B', 330], ['C', 90]].forEach(([n, t]) => { R[n] = V(r * Math.cos(deg(t)), r * Math.sin(deg(t)), 0); }); R.S = V(0, 0, Math.sqrt(b * b - a * a / 3)); return R; },

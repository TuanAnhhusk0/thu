    {k: 'kn', lab: 'HĐ2 · HĐ3', t: 'Khoảng cách giữa các đối tượng song song', min: 7, pg: 'tr. 55–56',
      b: [`**HĐ2.** Cho đường thẳng $a$ song song với mặt phẳng $(P)$. Lấy hai điểm $M$, $N$ bất kì thuộc $a$ và gọi $A$, $B$ tương ứng là các hình chiếu của chúng trên $(P)$ (Hình 7.78). Giải thích vì sao $ABNM$ là một hình chữ nhật và $M$, $N$ có cùng khoảng cách đến $(P)$.`,
        {box: `==Khoảng cách giữa đường thẳng $a$ và mặt phẳng $(P)$ song song với $a$==, kí hiệu $d(a, (P))$, là khoảng cách từ một điểm bất kì trên $a$ đến $(P)$.`},
        `**HĐ3.** a) Cho hai đường thẳng $m$ và $n$ song song với nhau. Khi một điểm $M$ thay đổi trên $m$ thì khoảng cách từ nó đến đường thẳng $n$ có thay đổi hay không? b) Cho hai mặt phẳng song song $(P)$ và $(Q)$ và một điểm $M$ thay đổi trên $(P)$ (Hình 7.79). Hỏi khoảng cách từ $M$ đến $(Q)$ thay đổi thế nào khi $M$ thay đổi?`,
        {box: [`==Khoảng cách giữa hai mặt phẳng song song== $(P)$ và $(Q)$, kí hiệu $d((P), (Q))$, là khoảng cách từ một điểm bất kì thuộc mặt phẳng này đến mặt phẳng kia.`, `==Khoảng cách giữa hai đường thẳng song song== $m$ và $n$, kí hiệu $d(m, n)$, là khoảng cách từ một điểm thuộc đường thẳng này đến đường thẳng kia.`]},
        {q: `Nếu đường thẳng $a$ thuộc mặt phẳng $(P)$ và mặt phẳng $(Q)$ song song với $(P)$ thì giữa $d(a, (Q))$ và $d((P), (Q))$ có mối quan hệ gì?`, a: `Bằng nhau.`},
        {note: `Khoảng cách giữa hai đáy của một hình lăng trụ được gọi là ==chiều cao của hình lăng trụ== đó.`, h: 'Chú ý'}],
      st: [{l: 'HĐ2', b: [{ds: [[`$MA // NB$ (cùng vuông góc với $(P)$) nên $M$, $N$, $A$, $B$ đồng phẳng; $MN // AB$ (giao tuyến của $mp(MN, MA)$ với $(P)$ song song với $a$).`, `$ABNM$ là hình bình hành có góc vuông ⇒ ==hình chữ nhật== ⇒ $MA = NB$.`]]}]},
        {l: 'HĐ3', b: [{ds: [[`a) Không đổi (bằng khoảng cách giữa hai cạnh đối của các hình chữ nhật tương tự). b) ==Không đổi==: kéo thanh trượt để di chuyển $M$ trên $(P)$.`, '']]}]}],
      fig: {cap: 'Khoảng cách không đổi khi điểm di chuyển', par: {v: {v: 0, opts: ['HĐ2: a // (P)', 'HĐ3: (P) // (Q)'], lab: 'Hình'}, m: {v: 0.3, min: 0, max: 1, step: 0.02, lab: 'Vị trí của M', fmt: v => vn(v)}},
        pts: P => { if (P.v) { const M = V(-2.6 + 5 * P.m, -1 + 2 * P.m, 2.6); return Object.assign(PH('_p', V(0, 0, 2.6), 3.4, 2.2), PH('_q', V(0, 0, 0), 3.4, 2.2), {M, A: V(M[0], M[1], 0)}); }
          const M = V(-2.4, -0.6, 2.2), N = V(2.4, 0.6, 2.2), X = lerp(M, N, P.m); return Object.assign(PH('_p', V(0, 0, 0), 3.6, 2.4), {M, N, A: V(M[0], M[1], 0), B: V(N[0], N[1], 0), X, _x: V(X[0], X[1], 0)}); },
        hide: 'X',
        items: P => P.v ? [PLANE('_q', 'Q', 3), PLANE('_p', 'P', 1), {pt: 'M'}, {s: 'MA', c: 4, w: 2.8}, {ra: 'AM_q2', c: 4}, {tx: 'MA = 2,6', at: 'M', dx: 40, dy: -16, c: 4}]
          : [PLANE('_p', 'P', 1), {l: 'MN', x: [-0.2, 1.2], c: 4, w: 2.6, n: 'a'}, {s: 'MA NB', c: 2, w: 2.2}, {s: 'AB', c: 3, w: 2}, {ra: 'AMB', c: 2}, {ra: 'BNA', c: 2}, {s: 'X_x', c: 5, w: 2, d: 1}]}},

    {k: 'vd', lab: 'Ví dụ 2 · Luyện tập 2', t: 'Tính khoảng cách song song', min: 8, pg: 'tr. 56',
      b: [`**Ví dụ 2.** Cho hình hộp đứng $ABCD.A'B'C'D'$, đáy là các hình thoi có cạnh bằng $a$, $\\hat{BAD} = 120°$, $AA' = h$. Tính các khoảng cách giữa $A'C'$ và $(ABCD)$, giữa $AA'$ và $(BDD'B')$.`,
        `**Luyện tập 2.** Cho hình chóp $S.ABC$ có $SA ⊥ (ABC)$, $SA = h$. Gọi $M$, $N$, $P$ tương ứng là trung điểm của $SA$, $SB$, $SC$. a) Tính $d((MNP), (ABC))$ và $d(NP, (ABC))$. b) Giả sử tam giác $ABC$ vuông tại $B$ và $AB = a$. Tính $d(A, (SBC))$.`],
      st: [{l: 'Ví dụ 2', fp: {v: 0}, b: [{ds: [[`$A'C' ⊂ (A'B'C'D') // (ABCD)$; hộp đứng nên $A'A ⊥ (ABCD)$.`, `$d(A'C', (ABCD)) = A'A = $ ==$h$==.`], [`$AA' // BB'$ ⇒ $AA' // (BDD'B')$. Gọi $O$ là tâm hình thoi: $AO ⊥ BD$, $AO ⊥ BB'$ ⇒ $AO ⊥ (BDD'B')$.`, `Tam giác $BAD$ cân tại $A$, $\\hat{BAD} = 120°$ ⇒ $\\hat{ABO} = 30°$ ⇒ $d = AO = \\frac{1}{2}AB = $ ==$\\frac{a}{2}$==.`]]}]},
        {l: 'Luyện tập 2a', fp: {v: 1}, b: [{ds: [[`$(MNP) // (ABC)$; $M ∈ (MNP)$, $A$ là hình chiếu của $M$ trên $(ABC)$.`, `$d((MNP), (ABC)) = MA = $ ==$\\frac{h}{2}$==; $NP ⊂ (MNP)$ nên $d(NP, (ABC)) = \\frac{h}{2}$.`]]}]},
        {l: 'Luyện tập 2b', fp: {v: 1}, b: [{ds: [[`$BC ⊥ AB$, $BC ⊥ SA$ ⇒ $BC ⊥ (SAB)$. Kẻ $AK ⊥ SB$ thì $AK ⊥ BC$ ⇒ $AK ⊥ (SBC)$.`, ''], [`Tam giác $SAB$ vuông tại $A$: $\\frac{1}{AK^2} = \\frac{1}{h^2} + \\frac{1}{a^2}$.`, `$d(A, (SBC)) = AK = $ ==$\\frac{ah}{\\sqrt{a^2 + h^2}}$==.`]]}]}],
      fig: {cap: 'Ví dụ 2 · Luyện tập 2', par: {v: {v: 0, opts: ['Ví dụ 2', 'Luyện tập 2'], lab: 'Bài'}},
        pts: P => { if (P.v) { const T = CHOPVB(4); return Object.assign(T, {M: mid(T.S, T.A), N: mid(T.S, T.B), P: mid(T.S, T.C), K: footL(T.A, T.S, T.B)}); }
          const a = 3, A = V(-1.6, -0.4, 0), B = add(A, V(a, 0, 0)), D = add(A, V(a * Math.cos(deg(120)), a * Math.sin(deg(120)), 0)), T = HOP({base: {A, B, C: add(B, sub(D, A)), D}, h: 3}); return Object.assign(T, {O: mid(A, add(B, sub(D, A)))}); },
        solid: P => P.v ? F_CHOP3 : F_HOP,

          : [{s: "A'C'", c: 2, w: 2.4, f: 1}, {s: "AA'", c: 4, w: 2.8, f: 1}, {an: 'BAD', c: 6, lab: '120°'}, {s: 'AC BD', c: 6, w: 1.4, f: 1}, {pt: 'O', f: 1}, {p: "BDD'B'", c: 3, o: .14, e: 0, f: 1}, {s: 'AO', c: 5, w: 2.8, f: 1}, {ra: 'OAB', c: 5, f: 1}]}},

      st: [{l: 'Khoảng cách', b: [{ds: [[`Thanh ngang song song với mặt đường (song song với đường nối hai chân cột). Khoảng cách cần tìm là độ dài đoạn vuông góc $TH$ hạ từ đỉnh cột xuống mặt dốc.`, ''], [`Cột thẳng đứng tạo với pháp tuyến của mặt dốc một góc $15°$.`, `$d = 2,28 · \\cos 15° ≈ $ ==$2,20$ m==.`]]}]},

          return {_r1: add(V(0, -2, 0), mul(u, -3)), _r2: add(V(0, -2, 0), mul(u, 3)), _r3: add(V(0, 2, 0), mul(u, 3)), _r4: add(V(0, 2, 0), mul(u, -3)), _h1: add(V(0, -2, 0), V(-3, 0, 0)), _h2: V(3, -2, 0), C, C2, T, T2, H, E: add(C, V(1, 0, 0)), F: add(C, mul(u, 1))}; },

    {k: 'kn', lab: 'HĐ4', t: 'Khoảng cách giữa hai đường thẳng chéo nhau', min: 8, pg: 'tr. 57–58',
      b: [`**HĐ4.** Cho hai đường thẳng chéo nhau $a$ và $b$. Gọi $(Q)$ là mặt phẳng chứa đường thẳng $b$ và song song với $a$. Hình chiếu $a'$ của $a$ trên $(Q)$ cắt $b$ tại $N$. Gọi $M$ là hình chiếu của $N$ trên $a$ (Hình 7.83). a) Mặt phẳng chứa $a$ và $a'$ có vuông góc với $(Q)$ hay không? b) Đường thẳng $MN$ có vuông góc với cả hai đường thẳng $a$ và $b$ hay không? c) Nêu mối quan hệ của khoảng cách giữa $a$, $(Q)$ và độ dài đoạn thẳng $MN$.`,
        {box: [`Đường thẳng $Δ$ ==cắt hai đường thẳng chéo nhau $a$, $b$ và vuông góc với cả hai== được gọi là ==đường vuông góc chung== của $a$ và $b$.`, `Nếu $Δ$ cắt $a$, $b$ tại $M$, $N$ thì độ dài đoạn $MN$ gọi là ==khoảng cách giữa hai đường thẳng chéo nhau $a$, $b$==.`]},
        {note: [`Khoảng cách giữa hai đường thẳng chéo nhau bằng khoảng cách giữa một trong hai đường thẳng đó đến ==mặt phẳng song song với nó và chứa đường thẳng còn lại==.`, `Khoảng cách giữa hai đường thẳng chéo nhau bằng khoảng cách giữa ==hai mặt phẳng song song== tương ứng chứa hai đường thẳng đó.`], h: 'Nhận xét'},
        {pp: PP7.cheo, h: 'Phương pháp: khoảng cách giữa hai đường thẳng chéo nhau'}],
      st: [{l: 'HĐ4a, b', b: [{ds: [[`a) Mặt phẳng $(a, a')$ chứa các đường chiếu (vuông góc với $(Q)$) ⇒ ==vuông góc với $(Q)$==.`, ''], [`b) $MN$ nằm trong $mp(a, a')$, $MN ⊥ a$ ⇒ $MN ⊥ a'$; vì $MN$ là đường chiếu ⇒ $MN ⊥ (Q)$ ⇒ $MN ⊥ b$.`, `$MN$ ==vuông góc với cả $a$ và $b$==.`]]}]},
        {l: 'HĐ4c', b: [{ds: [[`$MN ⊥ (Q)$, $M ∈ a // (Q)$.`, `$d(a, (Q)) = MN$. Kéo hai điểm $X ∈ a$, $Y ∈ b$: độ dài $XY$ luôn ==không nhỏ hơn $MN$==.`]]}]}],
      fig: {cap: 'Đường vuông góc chung MN là đoạn ngắn nhất nối a và b', par: {x: {v: 0.75, min: 0, max: 1, step: 0.02, lab: 'Điểm X trên a', fmt: v => vn(v)}, y: {v: 0.3, min: 0, max: 1, step: 0.02, lab: 'Điểm Y trên b', fmt: v => vn(v)}},

    {k: 'vd', lab: 'Ví dụ 3 · Khám phá · Luyện tập 3', t: 'Xác định đường vuông góc chung', min: 9, pg: 'tr. 58',
      b: [`**Ví dụ 3.** Cho hình chóp $S.ABC$ có $SA ⊥ (ABC)$, $AB = a$, $\\hat{ABC} = 60°$. Xác định đường vuông góc chung và tính khoảng cách giữa hai đường thẳng $SA$ và $BC$.`,
        `**Khám phá.** Cho đường thẳng $a$ vuông góc với mặt phẳng $(P)$ và cắt $(P)$ tại $O$. Cho đường thẳng $b$ thuộc mặt phẳng $(P)$. Hãy tìm mối quan hệ giữa khoảng cách giữa $a$, $b$ và khoảng cách từ $O$ đến $b$ (Hình 7.88).`,
        `**Luyện tập 3.** Cho hình chóp $S.ABCD$ có đáy là hình vuông cạnh $a$, $SA ⊥ (ABCD)$, $SA = a\\sqrt{2}$. a) Tính khoảng cách từ $A$ đến $SC$. b) Chứng minh rằng $BD ⊥ (SAC)$. c) Xác định đường vuông góc chung và tính khoảng cách giữa $BD$ và $SC$.`,
        {note: `Khoảng cách giữa hai hình (điểm, đường thẳng, mặt phẳng) nêu trong bài là ==khoảng cách nhỏ nhất== giữa một điểm thuộc hình này và một điểm thuộc hình kia.`, h: 'Thảo luận'}],
      st: [{l: 'Ví dụ 3', fp: {v: 0}, b: [{ds: [[`Gọi $H$ là hình chiếu của $A$ trên $BC$: tam giác $ABH$ vuông tại $H$, $\\hat{ABH} = 60°$ ⇒ $BH = \\frac{a}{2}$.`, ''], [`$SA ⊥ (ABC)$ ⇒ $AH ⊥ SA$; lại có $AH ⊥ BC$.`, `==$AH$ là đường vuông góc chung==; $d(SA, BC) = AH = AB\\sin 60° = $ ==$\\frac{a\\sqrt{3}}{2}$==.`]]}]},
        {l: 'Khám phá', fp: false, b: [{ds: [[`Kẻ $OH ⊥ b$ ($H ∈ b$); $OH ⊂ (P)$ nên $OH ⊥ a$.`, `$OH$ là đường vuông góc chung ⇒ ==$d(a, b) = d(O, b)$==.`]]}]},
        {l: 'Luyện tập 3a, b', fp: {v: 1}, b: [{ds: [[`a) $AC = a\\sqrt{2} = SA$ ⇒ tam giác $SAC$ vuông cân tại $A$, $SC = 2a$; đường cao $AH = \\frac{SC}{2}$.`, `$d(A, SC) = $ ==$a$==.`], [`b) $BD ⊥ AC$, $BD ⊥ SA$ ⇒ ==$BD ⊥ (SAC)$==.`, '']]}]},
        {l: 'Luyện tập 3c', fp: {v: 1}, b: [{ds: [[`Gọi $O$ là tâm đáy, kẻ $OK ⊥ SC$ ($K ∈ SC$); $OK ⊂ (SAC)$ nên $OK ⊥ BD$.`, `==$OK$ là đường vuông góc chung== của $BD$ và $SC$.`], [`$OK = OC\\sin 45° = \\frac{a\\sqrt{2}}{2} · \\frac{\\sqrt{2}}{2}$.`, `$d(BD, SC) = $ ==$\\frac{a}{2}$==.`]]}]}],
      fig: {cap: 'Ví dụ 3 · Luyện tập 3', par: {v: {v: 0, opts: ['Ví dụ 3', 'Luyện tập 3'], lab: 'Bài'}},
        pts: P => { if (P.v) { const T = CHOPVA({a: 3, b: 3, h: 3 * Math.SQRT2}); return Object.assign(T, {H: footL(T.A, T.S, T.C), K: footL(T.O, T.S, T.C)}); }
          const a = 2.6, B = V(-1, -1.6, 0), A = add(B, V(a * Math.cos(deg(150)), a * Math.sin(deg(150)), 0)), C = add(B, V(4.2, 0.6, 0)), H = footL(A, B, C); return {A, B, C, H, S: add(A, V(0, 0, 3.6)), _x: add(B, mul(unit(sub(C, B)), 1))}; },
        solid: P => P.v ? F_CHOP4 : F_CHOP3,
        items: P => P.v ? [{ra: 'ASB', c: 6}, {s: 'AC', c: 6, w: 1.4}, {pt: 'H', f: 3}, {s: 'AH', c: 2, w: 2.4, f: 3}, {ra: 'HAS', c: 2, f: 3}, {s: 'BD', c: 3, w: 2.4, f: 4}, {pt: 'O K', f: 4}, {s: 'OK', c: 4, w: 3, f: 4}, {ra: 'KOS', c: 4, f: 4}, {ra: 'OKB', c: 4, f: 4}]
          : [{ra: 'ASB', c: 6}, {an: 'AB_x', c: 6, lab: '60°'}, {pt: 'H', f: 1}, {s: 'AH', c: 4, w: 3, f: 1}, {ra: 'HAB', c: 4, f: 1}, {ra: 'ASH', c: 4, f: 1}]}},

    {k: 'bt', lab: 'Bài 7.22 – 7.24', t: 'Khoảng cách trong hình chóp, hình hộp, tứ diện đều', min: 10, pg: 'tr. 59',
      b: [`**7.22.** Cho hình chóp $S.ABCD$ có đáy là một hình vuông cạnh $a$, mặt bên $SAD$ là một tam giác đều và $(SAD) ⊥ (ABCD)$. a) Tính chiều cao của hình chóp. b) Tính khoảng cách giữa $BC$ và $(SAD)$. c) Xác định đường vuông góc chung và tính khoảng cách giữa $AB$ và $SD$.`,
        `**7.23.** Cho hình hộp chữ nhật $ABCD.A'B'C'D'$ có $AA' = a$, $AB = b$, $BC = c$. a) Tính khoảng cách giữa $CC'$ và $(BB'D'D)$. b) Xác định đường vuông góc chung và tính khoảng cách giữa $AC$ và $B'D'$.`,
        `**7.24.** Cho tứ diện $ABCD$ có các cạnh đều bằng $a$. Gọi $M$, $N$ tương ứng là trung điểm của các cạnh $AB$, $CD$. Chứng minh rằng: a) $MN$ là đường vuông góc chung của $AB$ và $CD$. b) Các cặp cạnh đối diện trong tứ diện $ABCD$ đều vuông góc với nhau.`],
      st: [{l: 'Bài 7.22', fp: {v: 0}, b: [{ds: [[`a) Gọi $H$ là trung điểm $AD$: $SH ⊥ AD$, $(SAD) ⊥ (ABCD)$ ⇒ $SH ⊥ (ABCD)$.`, `Chiều cao $SH = $ ==$\\frac{a\\sqrt{3}}{2}$==.`], [`b) $BC // AD$ ⇒ $BC // (SAD)$; $AB ⊥ AD$ ⇒ $AB ⊥ (SAD)$.`, `$d(BC, (SAD)) = d(B, (SAD)) = AB = $ ==$a$==.`], [`c) Gọi $K$ là trung điểm $SD$: $AK ⊥ SD$; $AB ⊥ (SAD)$ ⇒ $AB ⊥ AK$.`, `==$AK$== là đường vuông góc chung; $d(AB, SD) = AK = $ ==$\\frac{a\\sqrt{3}}{2}$==.`]]}]},
        {l: 'Bài 7.23', fp: {v: 1}, b: [{ds: [[`a) $CC' // (BB'D'D)$; kẻ $CK ⊥ BD$ thì $CK ⊥ (BB'D'D)$.`, `$d = CK = \\frac{BC · CD}{BD} = $ ==$\\frac{bc}{\\sqrt{b^2 + c^2}}$==.`], [`b) Gọi $O$, $O'$ là tâm hai đáy: $OO' // AA'$ ⇒ $OO'$ vuông góc với hai đáy nên vuông góc với $AC$ và $B'D'$; $O ∈ AC$, $O' ∈ B'D'$.`, `==$OO'$== là đường vuông góc chung, $d(AC, B'D') = $ ==$a$==.`]]}]},
        {l: 'Bài 7.24', fp: {v: 2}, b: [{ds: [[`a) $CM = DM$ (đường cao của hai tam giác đều cạnh $a$) ⇒ tam giác $MCD$ cân ⇒ $MN ⊥ CD$; tương tự $NA = NB$ ⇒ $MN ⊥ AB$.`, `==$MN$ là đường vuông góc chung== của $AB$, $CD$.`], [`b) $AB ⊥ CM$, $AB ⊥ DM$ ⇒ $AB ⊥ (MCD)$ ⇒ $AB ⊥ CD$; tương tự cho hai cặp còn lại.`, `Các cặp cạnh đối diện ==đôi một vuông góc==.`]]}]}],
      fig: {cap: 'Bài 7.22 · 7.23 · 7.24', par: {v: {v: 0, opts: ['Bài 7.22', 'Bài 7.23', 'Bài 7.24'], lab: 'Bài'}},
        pts: P => { if (P.v === 0) { const a = 3.2, A = V(-1.6, -1.6, 0), B = V(1.6, -1.6, 0), C = V(1.6, 1.6, 0), D = V(-1.6, 1.6, 0), H = mid(A, D), S = add(H, V(0, 0, a * Math.sqrt(3) / 2)); return {S, A, B, C, D, H, K: mid(S, D)}; }
          if (P.v === 1) { const T = HOP({a: 4.2, b: 2.8, h: 2.6}); return Object.assign(T, {O: mid(T.A, T.C), "O'": mid(T["A'"], T["C'"]), K: footL(T.C, T.B, T.D)}); }
          const T = TDDEU(4.6); return Object.assign(T, {M: mid(T.A, T.B), N: mid(T.C, T.D)}); },
        solid: P => P.v === 0 ? F_CHOP4 : P.v === 1 ? F_HOP : F_TD,
        items: P => P.v === 0 ? [{pt: 'H'}, {s: 'SH', c: 4, w: 2.6, f: 1}, {ra: 'HSA', c: 4, f: 1}, {p: 'SAD', c: 3, o: .14, e: 0, f: 1}, {s: 'AB', c: 1, w: 3, f: 2}, {pt: 'K', f: 3}, {s: 'AK', c: 2, w: 2.8, f: 3}, {ra: 'KAS', c: 2, f: 3}, {ra: 'AKB', c: 2, f: 3}]
          : P.v === 1 ? [{p: "BB'D'D", c: 3, o: .14, e: 0, f: 1}, {pt: 'K', f: 1}, {s: 'CK', c: 4, w: 2.6, f: 1}, {ra: 'KCB', c: 4, f: 1}, {s: "AC B'D'", c: 2, w: 2.2, f: 2}, {pt: "O O'", f: 2}, {s: "OO'", c: 1, w: 3, f: 2}]
          : [{pt: 'M N'}, {s: 'MN', c: 1, w: 3, f: 3}, {s: 'CM DM', c: 6, w: 1.4, f: 3}, {ra: 'NMD', c: 1, f: 3}, {ra: 'MNB', c: 1, f: 3}, {p: 'MCD', c: 3, o: .14, e: 0, f: 4}]}},

    {k: 'bt', lab: 'Bài 7.25 – 7.27', t: 'Hai mặt phẳng song song trong hình lập phương · giá ba chân · độ sâu bể', min: 10, pg: 'tr. 59',
      b: [`**7.25.** Cho hình lập phương $ABCD.A'B'C'D'$ có cạnh $a$. a) Chứng minh rằng hai mặt phẳng $(D'AC)$ và $(BC'A')$ song song với nhau và $DB'$ vuông góc với hai mặt phẳng đó. b) Xác định các giao điểm $E$, $F$ của $DB'$ với $(D'AC)$, $(BC'A')$. Tính $d((D'AC), (BC'A'))$.`,
        `**7.26.** Giá đỡ ba chân ở Hình 7.90 đang được mở sao cho ba gốc chân cách đều nhau một khoảng bằng 110 cm. Tính chiều cao của giá đỡ, biết các chân của giá đỡ dài 129 cm.`,
        `**7.27.** Một bể nước có đáy thuộc mặt phẳng nằm ngang. Trong trường hợp này, độ sâu của bể là khoảng cách giữa mặt nước và đáy bể. Giải thích vì sao để đo độ sâu của bể, ta có thể thả quả dọi chạm đáy bể và đo chiều dài của đoạn dây dọi nằm trong bể nước.`],
      st: [{l: 'Bài 7.25a', fp: {v: 0}, b: [{ds: [[`$AC // A'C'$, $D'A // C'B$ ⇒ ==$(D'AC) // (BC'A')$==.`, ''], [`$AC ⊥ BD$, $AC ⊥ DD'$ ⇒ $AC ⊥ (BDD'B')$ ⇒ $AC ⊥ DB'$; tương tự $AD' ⊥ DB'$ (vì $AD' ⊥ (A'B'CD)$).`, `==$DB' ⊥ (D'AC)$== nên cũng vuông góc với $(BC'A')$.`]]}]},
        {l: 'Bài 7.25b', fp: {v: 0}, b: [{ds: [[`$DA = DC = DD'$ và $B'A = B'C = B'D'$ ⇒ $D$, $B'$ cùng nằm trên trục của tam giác đều $ACD'$ ⇒ $E$ là trọng tâm tam giác $ACD'$; tương tự $F$ là trọng tâm tam giác $A'BC'$.`, ''], [`Tính được $DE = FB' = \\frac{DB'}{3}$ ⇒ $EF = \\frac{DB'}{3} = \\frac{a\\sqrt{3}}{3}$.`, `$d((D'AC), (BC'A')) = $ ==$\\frac{a\\sqrt{3}}{3}$==.`]]}]},
        {l: 'Bài 7.26', fp: {v: 1}, b: [{ds: [[`Ba gốc chân tạo thành tam giác đều cạnh 110 cm; đỉnh giá đỡ chiếu xuống tâm $O$ (ba chân bằng nhau), $OA = \\frac{110}{\\sqrt{3}}$.`, `$h = \\sqrt{129^2 - \\frac{110^2}{3}} ≈ $ ==$112,3$ cm==.`]]}]},
        {l: 'Bài 7.27', fp: {v: 2}, b: [{ds: [[`Dây dọi có phương thẳng đứng nên vuông góc với mặt nước và đáy bể (hai mặt phẳng nằm ngang, song song).`, `Đoạn dây dọi trong nước là đoạn vuông góc giữa hai mặt phẳng song song ⇒ chiều dài của nó ==bằng độ sâu của bể==.`]]}]}],
      fig: {cap: 'Bài 7.25 · 7.26 · 7.27', par: {v: {v: 0, opts: ['Bài 7.25', 'Bài 7.26', 'Bài 7.27'], lab: 'Bài'}},
        pts: P => { if (P.v === 0) { const T = HOP({a: 3.4, b: 3.4, h: 3.4}); return Object.assign(T, {E: cen(T.A, T.C, T["D'"]), F: cen(T["A'"], T.B, T["C'"])}); }
          if (P.v === 1) { const s = 0.03, r = 110 / Math.sqrt(3) * s, h = Math.sqrt(129 * 129 - 110 * 110 / 3) * s, R = {O: V(0, 0, 0), T: V(0, 0, h)}; [['A', 210], ['B', 330], ['C', 90]].forEach(([n, t]) => { R[n] = V(r * Math.cos(deg(t)), r * Math.sin(deg(t)), 0); }); return R; }
          const T = HOP({a: 4.4, b: 3, h: 3.2}); return Object.assign(T, {_w0: lerp(T.A, T["A'"], .6), _w1: lerp(T.B, T["B'"], .6), _w2: lerp(T.C, T["C'"], .6), _w3: lerp(T.D, T["D'"], .6), X: V(0.4, 0, 1.92), Y: V(0.4, 0, 0), Z: V(0.4, 0, 3.6)}); },
        solid: P => P.v === 0 ? F_HOP : P.v === 2 ? F_HOP : '',
        items: P => P.v === 0 ? [{p: "D'AC", c: 1, o: .18}, {p: "BC'A'", c: 3, o: .18}, {s: "DB'", c: 4, w: 2.6, f: 1}, {pt: 'E F', f: 2}, {s: 'EF', c: 2, w: 3.4, f: 2}]
          : P.v === 1 ? [{s: 'TA TB TC', c: 0, w: 4, sd: 1}, {s: 'AB BC CA', c: 6, w: 1.6, d: 1}, {pt: 'O'}, {s: 'TO OA', c: 4, w: 2.2, f: 2}, {ra: 'OTA', c: 4, f: 2}, {tx: '110 cm', at: 'B', dx: -40, dy: 20, c: 6}, {tx: '129 cm', at: 'A', dx: -30, dy: -40, c: 0}]
          : [{p: '_w0_w1_w2_w3', c: 1, o: .22, e: 0}, {s: 'ZX', c: 6, w: 1.4}, {s: 'XY', c: 4, w: 2.6}, {pt: 'Y'}, {ra: 'YX_w1', c: 4, f: 3}]}},

    {k: 'eb', t: 'Em có biết? Hiện tượng đứng bóng', min: 4, pg: 'tr. 59–60',
      b: [`Vì sao ở vùng phía bắc chí tuyến Bắc và vùng phía nam chí tuyến Nam, tia sáng mặt trời ==không bao giờ vuông góc với mặt đất== (không xảy ra hiện tượng đứng bóng thực sự)? (Theo nationalgeographic.com)`,
        `Tia sáng chỉ vuông góc với mặt đất (có hướng đi qua tâm Trái Đất) tại vị trí $P_0$ trên đoạn thẳng nối tâm $O$ của Trái Đất và tâm $I$ của Mặt Trời. Đường thẳng $OI$ thuộc mặt phẳng quỹ đạo, trục quay $SN$ luôn tạo với mặt phẳng đó góc khoảng $66,5°$ nên $\\hat{NOI} ≥ 66,5°$.`,
        `Mỗi vị trí $P$ phía bắc chí tuyến Bắc có vĩ độ bắc $φ > 23,5°$, tức $\\hat{NOP} = 90° - φ < 66,5°$ ($ON$ vuông góc với mặt phẳng xích đạo nên $OP$ tạo với mặt phẳng xích đạo và với $ON$ hai góc phụ nhau). Nếu có đứng bóng thực sự ở $P$ thì $P ∈ OI$ và $\\hat{NOP} = \\hat{NOI} ≥ 66,5°$ — ==mâu thuẫn==.`,
        {note: `Hiểu theo nghĩa rộng, hiện tượng ==đứng bóng== là khi tia sáng chiếu trực diện tới vị trí đó: xảy ra khi kinh tuyến qua vị trí đó và tâm $I$ của Mặt Trời cùng thuộc một nửa mặt phẳng bờ $NS$ — mỗi ngày đều có, gọi là ==giữa trưa== (khoảng 12 giờ ± 16 phút). Góc giữa tia sáng lúc giữa trưa và mặt phẳng nằm ngang là ==góc Mặt Trời==; mùa hè góc Mặt Trời lớn nên nhiệt độ cao.`}]},

    {k: 'tk', t: 'Tổng kết Bài 26', min: 5,

        ['Hai đường chéo nhau', `Độ dài đoạn vuông góc chung; bằng $d(a, (Q))$ với $(Q) ⊃ b$, $(Q) // a$; bằng khoảng cách giữa hai mặt phẳng song song chứa chúng.`],

/* ================= Phóng to, thu nhỏ từng nửa ================= */
function applyTz() { lessonEl.style.setProperty('--tz', ST.tz); $('#tzVal').textContent = Math.round(ST.tz * 100) + '%'; }
function setTz(v) { ST.tz = clamp(Math.round(v * 10) / 10, .7, 1.8); applyTz(); save(); }
$('#tzUp').onclick = () => setTz(ST.tz + .1);
$('#tzDown').onclick = () => setTz(ST.tz - .1);
$('#tzVal').onclick = () => setTz(1);
/* thu phóng quanh tâm khung nhìn (như GeoGebra); f = 0: về khung nhìn chuẩn */
function figZoom(f) { const s = scr(); if (!s.fig) return; const fs = figState(s), z0 = fs.zoom; fs.zoom = clamp(f ? z0 * f : 1, .4, 4); if (!f) { fs.tx = 0; fs.ty = 0; } else { fs.tx *= fs.zoom / z0; fs.ty *= fs.zoom / z0; } schedule(); }
$('#fzIn').onclick = () => figZoom(1.2);
$('#fzOut').onclick = () => figZoom(1 / 1.2);
$('#fzVal').onclick = () => figZoom(0);

/* ================= Tương tác với hình ================= */
let drag = null, spinId = 0;
const ptrs = new Map(); let pinch = null;
function stopSpin() { if (spinId) cancelAnimationFrame(spinId); spinId = 0; $('#fSpin').setAttribute('aria-pressed', 'false'); $('#fSpin').textContent = '▶ Xoay'; }
function startSpin() {
  if (RM()) return;
  $('#fSpin').setAttribute('aria-pressed', 'true'); $('#fSpin').textContent = '❚❚ Dừng';
  let last = performance.now();
  const stepF = t => { const fs = figState(scr()); fs.az = ((fs.az + (t - last) * .018 + 180) % 360) - 180; last = t; drawFig(); spinId = requestAnimationFrame(stepF); };
  spinId = requestAnimationFrame(stepF);
}
let rafD = 0; const schedule = () => { if (!rafD) rafD = requestAnimationFrame(() => { rafD = 0; drawFig(); }); };
svg.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  const fs = figState(scr());
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = {d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, z: fs.zoom, tx: fs.tx, ty: fs.ty}; drag = null; return; }
  stopSpin();
  const d2 = !!(scr().fig && scr().fig.d2);
  drag ={id: e.pointerId, x: e.clientX, y: e.clientY, az: fs.az, el: fs.el, pan: e.shiftKey || d2, tx: fs.tx, ty: fs.ty};
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
});
svg.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  const fs = figState(scr());
  if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()]; fs.zoom = clamp(pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d, .4, 4); fs.tx = pinch.tx * fs.zoom / pinch.z; fs.ty = pinch.ty * fs.zoom / pinch.z; schedule(); return; }
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (drag.pan) { const r = svg.getBoundingClientRect(), k = Math.min(r.width / FW, r.height / FH) || 1; fs.tx = drag.tx + dx / k; fs.ty = drag.ty + dy / k; }
  else { fs.az = ((drag.az + dx * .45 + 540) % 360) - 180; fs.el = clamp(drag.el + dy * .35, -10, 89); }
  schedule();
});
const endP = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (drag && e.pointerId === drag.id) drag = null; };
svg.addEventListener('pointerup', endP); svg.addEventListener('pointercancel', endP);
/* lăn chuột: thu phóng quanh con trỏ, điểm dưới con trỏ đứng yên (như GeoGebra) */
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const s = scr(), fs = figState(s), z0 = fs.zoom, z1 = clamp(z0 * Math.exp(-clamp(e.deltaY, -200, 200) * .0015), .4, 4);
  if (s.fig && s.fig.d2) { const r = svg.getBoundingClientRect(), k = Math.min(r.width / FW, r.height / FH) || 1, mx = (e.clientX - r.left - r.width / 2) / k, my = (e.clientY - r.top - r.height / 2) / k; fs.tx = mx - (mx - fs.tx) * z1 / z0; fs.ty = my - (my - fs.ty) * z1 / z0; }
  fs.zoom = z1; schedule();
}, {passive: false});
$('#fReset').onclick = () => { const s = scr(); FST.delete(skey()); stopSpin(); setupFig(s); drawFig(); };
$('#fSpin').onclick = () => { if (spinId) stopSpin(); else startSpin(); };
const IC_MAX = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 7.5v-4h4M12.5 3.5h4v4M16.5 12.5v4h-4M7.5 16.5h-4v-4"/></svg>', IC_MIN = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 3.5v4h-4M12.5 3.5v4h4M12.5 16.5v-4h4M7.5 16.5v-4h-4"/></svg>';
function toggleFigMax() { if (!scr().fig) return; const on = !document.body.classList.contains('figmax'), b = $('#fMax'), t = on ? 'Thu hình về nửa màn hình (phím H)' : 'Phóng to hình ra cả màn hình (phím H)'; document.body.classList.toggle('figmax', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.innerHTML = on ? IC_MIN : IC_MAX; b.title = t; b.setAttribute('aria-label', t); requestAnimationFrame(() => { drawFig(); inkResize(); }); }
$('#fMax').onclick = toggleFigMax;
/* ẩn/hiện hình minh hoạ: ghi nhớ riêng cho máy để dọc (p) và xoay ngang (l); điện thoại (cạnh ngắn < 600px) mặc định ẩn hình */
function figOri() { return innerWidth > innerHeight ? 'l' : 'p'; }
function figShown() { const v = ST.fig && ST.fig[figOri()]; return typeof v === 'boolean' ? v : Math.min(innerWidth, innerHeight) >= 600; }
function applyFigVis() {
  const has = !!scr().fig, on = figShown(), b = $('#figBtn'), t = on ? 'Ẩn hình minh hoạ (phím I)' : 'Hiện hình minh hoạ (phím I)';
  document.body.classList.toggle('nofig', has && !on);
  if (has && !on) document.body.classList.remove('figmax');
  b.hidden = !has; b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.setAttribute('aria-label', on ? 'Ẩn hình minh hoạ' : 'Hiện hình minh hoạ'); b.title = t;
  b.querySelector('span').textContent = on ? 'Ẩn hình' : 'Hiện hình';
}
function toggleFigVis() {
  if (!scr().fig) return;
  const on = !figShown();
  ST.fig = Object.assign({p: null, l: null}, ST.fig, {[figOri()]: on}); save(); applyFigVis();
  requestAnimationFrame(() => { drawFig(); inkResize(); if (on && getComputedStyle(stage).gridTemplateColumns.trim().split(/\s+/).length === 1) figp.scrollIntoView({block: 'start', behavior: 'smooth'}); });
}
$('#figBtn').onclick = toggleFigVis;
let fvT; addEventListener('resize', () => { clearTimeout(fvT); fvT = setTimeout(() => { if (document.body.classList.contains('nofig') !== (!!scr().fig && !figShown())) { applyFigVis(); drawFig(); inkResize(); } }, 120); });
/* cụm nút thu phóng: hiện khi rê chuột trên hình, ẩn sau 2,5 giây chuột đứng yên (trừ khi chuột đang ở trên nút) */
const fwrap = $('.fwrap'); let actT = 0;
const wake = e => { if (e.pointerType && e.pointerType !== 'mouse') return; fwrap.classList.add('act'); clearTimeout(actT); if (!e.target.closest('.fzoom')) actT = setTimeout(() => fwrap.classList.remove('act'), 2500); };
['pointermove', 'pointerdown', 'wheel'].forEach(t => fwrap.addEventListener(t, wake, {passive: true}));
fwrap.addEventListener('pointerleave', () => { clearTimeout(actT); actT = setTimeout(() => fwrap.classList.remove('act'), 600); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-par]')) { const s = scr(), fs = figState(s), n = t.dataset.par, p = s.fig.par[n]; fs.par[n] = parseFloat(t.value); rangeFill(t); const o = $(`[data-pout="${n}"]`); if (o) o.textContent = p.fmt ? p.fmt(fs.par[n]) : fs.par[n]; schedule(); }
});

/* ================= Bút vẽ trên màn chiếu ================= */
const ink = $('#ink'), ictx = ink.getContext('2d'), INK = new Map();
let penColor = '#e2262f', penDraw = null;
function inkResize() { const r = stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; ink.width = Math.round(r.width * dpr); ink.height = Math.round(r.height * dpr); ictx.setTransform(dpr, 0, 0, dpr, 0, 0); inkRedraw(); }
function inkStrokes() { const k = skey(); if (!INK.has(k)) INK.set(k, []); return INK.get(k); }
function inkRedraw() { const r = stage.getBoundingClientRect(); ictx.clearRect(0, 0, r.width, r.height); inkStrokes().forEach(st => { ictx.strokeStyle = st.c; ictx.lineWidth = 4; ictx.lineCap = 'round'; ictx.lineJoin = 'round'; ictx.beginPath(); st.p.forEach((p, i) => { const x = p[0] * r.width, y = p[1] * r.height; if (i) ictx.lineTo(x, y); else ictx.moveTo(x, y); }); ictx.stroke(); }); }
function inkLoad() { inkResize(); }
ink.addEventListener('pointerdown', e => { if (!document.body.classList.contains('pen')) return; const r = ink.getBoundingClientRect(); penDraw = {c: penColor, p: [[(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]]}; inkStrokes().push(penDraw); try { ink.setPointerCapture(e.pointerId); } catch (_) {} });
ink.addEventListener('pointermove', e => { if (!penDraw) return; const r = ink.getBoundingClientRect(); penDraw.p.push([(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]); inkRedraw(); });
const penUp = () => { penDraw = null; };
ink.addEventListener('pointerup', penUp); ink.addEventListener('pointercancel', penUp);
function togglePen(on) { on = on == null ? !document.body.classList.contains('pen') : on; document.body.classList.toggle('pen', on); $('#btnPen').setAttribute('aria-pressed', on ? 'true' : 'false'); $('#pentools').hidden = !on; }
$('#btnPen').onclick = () => togglePen();
$$('[data-pc]').forEach(b => { b.onclick = () => { penColor = b.dataset.pc; $$('[data-pc]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); }; });
$('#penUndo').onclick = () => { inkStrokes().pop(); inkRedraw(); };
$('#penClear').onclick = () => { INK.set(skey(), []); inkRedraw(); };

/* ================= Công cụ: ghi chú, nền, toàn màn hình, bấm giờ ================= */
function applyPrefs() {
  document.documentElement.setAttribute('data-theme', ST.theme);
  $('#btnNotes').setAttribute('aria-pressed', ST.notes ? 'true' : 'false');
  const g = $('.gv', lessonEl); if (g) g.hidden = !ST.notes;
}
$('#btnNotes').onclick = () => { ST.notes = !ST.notes; applyPrefs(); save(); };
$('#btnTheme').onclick = () => { ST.theme = ST.theme === 'dark' ? 'light' : 'dark'; applyPrefs(); save(); };
function toggleFull() { try { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); } catch (_) {} }
$('#btnFull').onclick = toggleFull;
const TM = {end: 0, id: 0, done: false};
const fmtT = ms => { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function timerUI() {
  const el = $('#timer');
  if (!TM.end && !TM.done) { el.className = 'timer'; el.innerHTML = `<span class="tl">Bấm giờ</span>${[1, 3, 5].map(x => `<button type="button" class="btn sm" data-tm="${x}" aria-label="Bấm giờ ${x} phút">${x}′</button>`).join('')}`; return; }
  el.className = 'timer' + (TM.done ? ' done' : '');
  el.innerHTML = `<output>${TM.done ? 'Hết giờ' : fmtT(TM.end - Date.now())}</output><button type="button" class="btn sm" data-tm="0">${TM.done ? 'Xong' : 'Dừng'}</button>`;
}
function startTimer(m) { clearInterval(TM.id); TM.id = 0; TM.done = false; if (!m) { TM.end = 0; timerUI(); return; } TM.end = Date.now() + m * 60000; timerUI(); TM.id = setInterval(() => { if (Date.now() >= TM.end) { clearInterval(TM.id); TM.done = true; announce('Hết giờ'); timerUI(); } else { const o = $('#timer output'); if (o) o.textContent = fmtT(TM.end - Date.now()); } }, 250); }

/* ================= Sự kiện ================= */
document.addEventListener('click', e => {
  const t = e.target, c = s => t.closest(s); let b;
  if ((b = c('[data-parc]'))) { const s = scr(), fs = figState(s), n = b.dataset.parc; fs.par[n] = +b.dataset.v; $$(`[data-parc="${n}"]`).forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); schedule(); return; }
  if ((b = c('[data-split]'))) { setSplit(ST.split + +b.dataset.split, true); return; }
  if ((b = c('[data-reveal]'))) { setK(+b.dataset.reveal); return; }
  if ((b = c('[data-goc]'))) { const [ci, li] = b.dataset.goc.split('.').map(Number); toggleToc(false); goC(ci, li, 0); return; }
  if ((b = c('[data-chapter]'))) { toggleToc(false); goC(+b.dataset.chapter, 0, 0); return; }
  if ((b = c('[data-resume]'))) { const l = ST.last; if (l) goC(l.C, l.L, l.S); return; }
  if ((b = c('[data-lesson]'))) { go(+b.dataset.lesson, 0); return; }
  if ((b = c('[data-goto]'))) { go(ST.L, +b.dataset.goto); return; }
  if ((b = c('[data-tm]'))) { startTimer(+b.dataset.tm); return; }
  if ((b = c('[data-qa]'))) { const a = document.getElementById(b.dataset.qa); a.hidden = !a.hidden; b.setAttribute('aria-expanded', a.hidden ? 'false' : 'true'); b.textContent = a.hidden ? 'Xem gợi ý trả lời' : 'Ẩn gợi ý'; return; }
  if ((b = c('[data-op]'))) { const box = b.closest('[data-mc]'), st = MCS.get(box.dataset.mc); if (st.ch == null) { st.ch = +b.dataset.op; box.innerHTML = mcInner(box.dataset.mc); } return; }
  if ((b = c('[data-mcshow]'))) { const box = b.closest('[data-mc]'); MCS.get(box.dataset.mc).ch = 'show'; box.innerHTML = mcInner(box.dataset.mc); return; }
  if ((b = c('[data-mcreset]'))) { const box = b.closest('[data-mc]'); MCS.get(box.dataset.mc).ch = null; box.innerHTML = mcInner(box.dataset.mc); return; }
});
$('#prev').onclick = retreat;
$('#next').onclick = nextScreen;
$('#reveal').onclick = () => setK(kOf() + 1);
$('#revealAll').onclick = () => setK(kOf() < nSteps(scr()) ? nSteps(scr()) : 0);
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target, tag = t.tagName;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag) || t.isContentEditable) return;
  if (document.body.classList.contains('tocopen')) { if (e.key === 'Escape' || e.key === 'm' || e.key === 'M') { e.preventDefault(); toggleToc(false); } return; }
  const onCtl = ['BUTTON', 'SUMMARY', 'A'].includes(tag);
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !onCtl)) { e.preventDefault(); advance(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); retreat(); }
  else if (e.key === 'g' || e.key === 'G') { ST.notes = !ST.notes; applyPrefs(); save(); }
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'b' || e.key === 'B') togglePen();
  else if (e.key === 'h' || e.key === 'H') toggleFigMax();
  else if (e.key === 'i' || e.key === 'I') toggleFigVis();
  else if (e.key === 'l' || e.key === 'L') toggleGrid();
  else if (e.key === 'm' || e.key === 'M') toggleToc(true);
  else if (e.key === '[') setSplit(ST.split - 5, true);
  else if (e.key === ']') setSplit(ST.split + 5, true);
  else if (e.key === '+' || e.key === '=') setTz(ST.tz + .1);
  else if (e.key === '-' || e.key === '_') setTz(ST.tz - .1);
  else if (e.key === 'Escape') { if (document.body.classList.contains('pen')) togglePen(false); else if (document.body.classList.contains('figmax')) toggleFigMax(); }
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { drawFig(); inkResize(); }, 100); });
if (window.ResizeObserver) { let rw = 0; new ResizeObserver(() => { cancelAnimationFrame(rw); rw = requestAnimationFrame(() => { schedule(); inkResize(); }); }).observe(figp); }
function fromHash() {
  const h = location.hash || '', m = /^#c(\d+)(?:-bai-(\d+)-(\d+))?$/.exec(h);
  if (m) { const c = clamp(+m[1] - 1, 0, CHS.length - 1); return {C: c, L: m[2] ? +m[2] : 0, S: m[3] ? +m[3] : 0}; }
  if (h === '#muc-luc') return {C: -1, L: 0, S: 0};
  return null;
}
window.addEventListener('hashchange', () => { const p = fromHash(); if (p && (p.C !== ST.C || p.L !== ST.L || p.S !== ST.S)) goC(p.C, p.L, p.S); });

/* ================= Khởi động ================= */
(function init() {
  const p = fromHash();
  if (p) { ST.C = setChapter(p.C); ST.L = clamp(p.L, 0, LESSONS.length - 1); ST.S = clamp(p.S, 0, LESSONS[ST.L].screens.length - 1); }
  $('#toc').inert = true;
  applyPrefs(); applySplit(); applyTz(); timerUI(); render();
})();
</script>
